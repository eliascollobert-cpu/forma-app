/* ================= IA & automatisations ================= */
/* Forma « IA » : moteur 100 % local (règles + données de l'utilisateur).
   Aucun appel réseau. Temps de réflexion et écriture progressive simulés. */
const FK={
  rnd:(a,b)=>a+Math.random()*(b-a),
  pick:a=>a[Math.floor(Math.random()*a.length)],
  cancelled(partial){const e=new Error('cancelled');e.code='cancelled';if(partial)e.text=partial;return e;},
  think(signal,min,max){
    return new Promise((res,rej)=>{
      if(signal&&signal.aborted)return rej(FK.cancelled());
      const t=setTimeout(res,FK.rnd(min,max));
      if(signal)signal.addEventListener('abort',()=>{clearTimeout(t);rej(FK.cancelled());},{once:true});
    });
  },
  async stream(text,onText,signal){
    const parts=text.split(/(\s+)/);let out='';
    for(let i=0;i<parts.length;){
      if(signal&&signal.aborted)throw FK.cancelled(out);
      const n=1+Math.floor(Math.random()*4);out+=parts.slice(i,i+n).join('');i+=n;
      if(onText)onText({text:out});
      await new Promise(r=>setTimeout(r,FK.rnd(18,55)));
    }
    return out;
  },
  opener(){const t=S.profile.tone||'coach';return FK.pick({coach:['Bonne question !','Allez, on regarde ça ensemble.','Top, voyons ça de près.'],direct:['Voilà ce que je vois.','En bref :','Réponse directe :'],calm:['Prenons le temps de regarder tes données.','Voyons cela tranquillement.','Regardons ça ensemble, étape par étape.']}[t]||['']);},
  closer(){const t=S.profile.tone||'coach';return FK.pick({coach:['Tu tiens le bon bout, continue !','On lâche rien.','Je suis là si tu veux ajuster quoi que ce soit.'],direct:[''],calm:['Avance pas à pas, la régularité fait le reste.','Pas besoin de tout changer d’un coup.']}[t]||['']);},
  ln:l=>l.filter(Boolean).join('\n'),
  list:a=>a.length>1?a.slice(0,-1).join(', ')+' et '+a[a.length-1]:(a[0]||''),
  lc:s=>s.charAt(0).toLowerCase()+s.slice(1),
  nrm:s=>norm(s).replace(/œ/g,'oe').replace(/æ/g,'ae'),

  /* ---------- analyse des données ---------- */
  stats(){
    const td=today(),t=T(),tot=totalsOn(td),l7=loggedDays(7),sl=weightSlope(),ws=weekSets();
    const sessions7=S.workouts.filter(w=>w.date>=addDays(td,-6)&&w.date<=td&&setCount(w)>0);
    const sets7=sessions7.reduce((a,w)=>a+setCount(w),0);
    const avgK=l7.length?l7.reduce((a,x)=>a+x.kcal,0)/l7.length:0,avgP=l7.length?l7.reduce((a,x)=>a+x.p,0)/l7.length:0;
    const low=MUSCLES.filter(m=>m!=='Mollets'&&m!=='Abdos'&&ws[m]<8).sort((a,b)=>ws[a]-ws[b]);
    const ids=[...new Set(S.workouts.flatMap(w=>w.entries.filter(e=>e.sets.length).map(e=>e.exId)))];
    const stagn=[],prog=[];
    ids.forEach(id=>{
      const ex=exById(id),s=sessionsOf(id);if(!ex||s.length<4)return;
      const last3=Math.max(...s.slice(-3).map(x=>e1(topSet(x.sets)))),before=Math.max(...s.slice(0,-3).map(x=>e1(topSet(x.sets))));

/* réglage automatique des calories selon la tendance de poids */
function autoAdj(){
  const sl=weightSlope(),g=S.profile.goal;let d=0;
  if(sl===null)return {d:0,sl:null};
  if(g==='gain'){if(sl<0.1)d=150;else if(sl>0.7)d=-150;}
  else if(g==='cut'){if(sl>-0.15)d=-150;else if(sl<-1)d=150;}
  else if(Math.abs(sl)>=0.25)d=sl>0?-100:100;
  return {d,sl};
}

/* séance conseillée + plan de charges automatique */
const PUSHM=['Pectoraux','Épaules','Triceps'],PULLM=['Dos','Biceps'];
function splitOf(w){let a=0,b=0,c=0;w.entries.forEach(e=>{const ex=exById(e.exId);if(!ex)return;const n=e.sets.length||1;if(PUSHM.includes(ex.m))a+=n;else if(PULLM.includes(ex.m))b+=n;else c+=n;});return a>=b&&a>=c?0:(b>=c?1:2);}
function nextTpl(){
  const ws=S.workouts.filter(w=>setCount(w)>0&&w.date<today()).sort((a,b)=>a.date<b.date?1:-1);
  const l=ws.find(x=>x.prog!==undefined);
  return (l&&l.prog<TPL.length)?(l.prog+1)%TPL.length:0;
}
function addEntry(w,id,plan){
  if(w.entries.some(e=>e.exId===id))return false;
  w.entries.push({exId:id,sets:[],plan:plan===undefined?planFor(id,w.date):plan});return true;
}
function logPlan(en){
  if(!en.plan||en.plan.src==='estimate')return 0;const rem=en.plan.n-en.sets.length;
  for(let i=0;i<rem;i++)en.sets.push({kg:en.plan.kg,reps:en.plan.reps});
  return Math.max(0,rem);
}
function lastSlotDay(slot,d){

/* messages d'erreur IA */
function aiMsg(e){
  const c=e&&e.code;
  if(c==='not_granted'||c==='sampling_disabled'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed'){AI=null;return 'Fonction indisponible pour le moment.';}
  if(c==='rate_limited')return 'Trop de demandes ou limite d’usage atteinte. Réessaie plus tard.';
  if(c==='session_expired')return 'Reconnecte-toi à Claude puis réessaie.';
  if(c==='invalid_json')return 'Je n’ai pas bien compris. Reformule en plus simple.';
  if(c==='image_rejected'||c==='images_unavailable')return 'Cette photo n’est pas acceptée. Essaie-en une autre.';
  if(c==='cancelled')return '';
  return 'Fonction momentanément indisponible. Réessaie.';
}

const EXAMPLES=['2 œufs, 80 g de flocons d’avoine et un café','Poulet, riz et brocoli au déjeuner','Squat 4x8 à 80 kg, développé couché 3x10 à 60 kg','Je pèse 76,4 kg ce matin'];
function matchEx(name){
  const n=norm(name),all=allEx();
  return all.find(e=>norm(e.n)===n)||all.find(e=>{const m=norm(e.n);return n.length>3&&m.includes(n);})||null;
}

function applyAI(d){
  const snap=JSON.stringify(S),log=[],td=today();d=d||{};
  (Array.isArray(d.meals)?d.meals:[]).forEach(m=>{
    if(!m||!m.name)return;const kcal=num(m.kcal);if(isNaN(kcal)||kcal<0||kcal>5000)return;
    const slot=SLOTS.includes(m.slot)?m.slot:slotNow(),g=num(m.grams),p=num(m.p)||0,c=num(m.c)||0,f=num(m.f)||0,name=String(m.name).slice(0,60);
    S.meals.push({id:uid(),date:td,slot,name,g:g>0?g:undefined,kcal,p,c,f});
    log.push({i:'utensils',t:name+(g>0?' · '+r0(g)+' g':''),s:r0(kcal)+' kcal · P '+r0(p)+' · G '+r0(c)+' · L '+r0(f)+' · '+slot});
  });
  (Array.isArray(d.sets)?d.sets:[]).forEach(x=>{
    if(!x||!x.exercise)return;
    const reps=Math.round(num(x.reps)),kg=isNaN(num(x.kg))?0:num(x.kg),cnt=Math.max(1,Math.min(12,Math.round(num(x.count))||1));
    if(!(reps>=1)||reps>100||kg<0||kg>1000)return;
    let ex=matchEx(x.exercise);
    if(!ex){ex={id:'c'+uid(),n:String(x.exercise).slice(0,50),m:MUSCLES.includes(x.muscle)?x.muscle:'Dos'};S.customEx.push(ex);}
    const w=ensureWorkout(td);let en=w.entries.find(e=>e.exId===ex.id);
    if(!en){en={exId:ex.id,sets:[]};w.entries.push(en);}
    for(let i=0;i<cnt;i++)en.sets.push({kg,reps});
    log.push({i:'dumbbell',t:ex.n,s:cnt+' × '+(kg>0?nf(kg)+' kg × '+reps:reps+' reps')});
  });
  const wt=num(d.weight);
  if(wt>=20&&wt<=400){S.bodyweights=S.bodyweights.filter(b=>b.date!==td);S.bodyweights.push({date:td,kg:wt});log.push({i:'chart',t:'Poids de corps',s:nf(wt)+' kg'});}
  if(log.length)save();
  return {log,note:typeof d.note==='string'?d.note.slice(0,200):'',snap};
}

async function genWorkout(){
  if(!AI||V.busy)return;
  V.busy='wgen';V.ctl=new AbortController();V.wErr='';render(true);
  try{
    const r=await FK.workout(V.ctl.signal);
    const list=Array.isArray(r&&r.exercises)?r.exercises:[],w=ensureWorkout(V.date);let n=0;w.prog=nextTpl();
    list.slice(0,8).forEach(x=>{
      if(!x)return;
      let ex=(x.id&&exById(x.id))||matchEx(x.name||'');
      if(!ex){if(!x.name||!MUSCLES.includes(x.muscle))return;ex={id:'c'+uid(),n:String(x.name).slice(0,50),m:x.muscle};S.customEx.push(ex);}
      const sets=Math.max(2,Math.min(6,Math.round(num(x.sets))||3)),reps=Math.max(1,Math.min(30,Math.round(num(x.reps))||10)),kg=num(x.kg);
      const rc=planFor(ex.id,V.date),pl=(!isNaN(kg)&&kg>=0)?{n:sets,kg:(rc&&rc.src==='history'&&rc.kg>0)?Math.min(kg,rc.kg):kg,reps,src:rc?rc.src:'estimate',max:rc?rc.max:undefined}:undefined;
      if(addEntry(w,ex.id,pl))n++;
    });
    if(!n)V.wErr='Aucun exercice compatible avec ton matériel. Réessaie.';
    else{if(typeof r.reason==='string'&&r.reason)w.note=r.reason.slice(0,240);save();}
  }catch(e){V.wErr=aiMsg(e);}
  V.busy=null;render(true);
}

/* ================= Séance guidée (chrono) ================= */
const COMPOUND=['dc','di','presh','dips','pompes','pdec','tract','chin','rowb','rowh','rowinv','tirage','dm','pike','squat','presse','fentes','goblet','squatb','bulg','sdt','rdlh','hip','hipb'];
const restFor=(id,change)=>{const b=S.profile.rest||90,c=COMPOUND.includes(id)?b*1.33:b*0.67;return Math.max(30,Math.round(c/15)*15)+(change?30:0);};
const planN=en=>en.plan?en.plan.n:(en.sets.length?en.sets.length:defSets());
const pendingSets=w=>w?w.entries.reduce((a,e)=>a+Math.max(0,planN(e)-e.sets.length),0):0;
function unfinishedPast(){const td=today();return S.workouts.filter(w=>w.date<td&&w.entries.length&&pendingSets(w)>0).sort((a,b)=>a.date<b.date?1:-1)[0]||null;}

let AC=null;
function initAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function beep(f,d,v){
  const P=V.play;if(!P||P.mode!=='beep'||!AC)return;
  try{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.value=v||.18;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d/1000);}catch(e){}
}
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}};

function pickNext(){
  const P=V.play,w=P&&getWorkout(P.date);if(!w)return null;
  const L=w.entries.length,from=Math.min(Math.max(0,P.from||0),Math.max(0,L-1));
  for(let k=0;k<L;k++){const i=(from+k)%L,e=w.entries[i];if(P.skip[e.exId])continue;const n=planN(e);if(e.sets.length<n)return {w,i,e,n,s:e.sets.length+1};}
  return null;
}
/* reprise : on repart de l'exercice commencé en dernier, pas du premier de la liste */
function resumeFrom(w){
  const L=w.entries.length;if(!L)return 0;
  let i=w.lastEx?w.entries.findIndex(e=>e.exId===w.lastEx):-1;
  if(i<0){for(let j=L-1;j>=0;j--)if(w.entries[j].sets.length){i=j;break;}}
  if(i<0)return 0;
  const e=w.entries[i];return e.sets.length<planN(e)?i:(i+1)%L;
}
function targetFor(e){
  if(e.plan&&!e.sets.length&&e.plan.on!==today()&&V.play.date>=today()){const np=planFor(e.exId,V.play.date);if(np)e.plan=np;}
  const p=e.plan||planFor(e.exId,V.play.date);
  if(p)return {kg:p.kg,reps:p.reps,src:p.src||'history',max:p.max,why:p.why};
  const last=lastSession(e.exId,V.play.date);
  if(last){const tp=topSet(last.sets);return {kg:tp.kg,reps:tp.reps,src:'history'};}
  return {kg:0,reps:parseInt(defReps(),10)||8,src:'none'};
}
function openPlay(date){
  const w=getWorkout(date);
  if(!w||!w.entries.length){toast('Ajoute d’abord des exercices à ta séance.');return;}
  V.play={date,phase:'ready',start:Date.now(),t0:0,skip:{},cur:null,mode:playMode(),autoAt:0,annEx:null,nextSaid:false,q:false,restEnd:0,restTot:0,reps:0,workStart:0,banner:'',prs:0,done:0,vol:0,lastSet:null,lastBeep:null};
  V.play.from=resumeFrom(w);
  if(!pickNext()){V.play=null;toast('Toutes les séries sont déjà validées.');return;}
  initAudio();wakeOn();
  {const wk=getWorkout(date),nm=(wk.prog!==undefined&&TPL[wk.prog])?TPL[wk.prog].n:'Séance';say(nm+'. '+wk.entries.length+' exercices, '+pendingSets(wk)+' séries. C’est parti !',true);}
  enterReady();renderPlayer();
}
function closePlay(){stopSpeak();wakeOff();V.play=null;renderPlayer();}
function enterReady(quiet){
  const P=V.play,nx=pickNext();if(!nx){finishPlay();return;}
  P.phase='ready';P.banner='';
  const isNew=P.annEx!==nx.e.exId;
  if(!P.cur||P.cur.ex!==nx.e.exId){P.cur=Object.assign({ex:nx.e.exId},targetFor(nx.e));P.cur.rec=P.cur.kg;}
  const warm=P.done===0&&nx.s===1&&P.cur.kg>0;
  P.autoAt=P.mode==='hands'?Date.now()+(P.done===0?(warm?120000:20000):(isNew?15000:5000)):0;
  if(!quiet)announceSet(nx,isNew);
  P.annEx=nx.e.exId;
}
function playGo(){
  const P=V.play;if(!P||P.phase!=='ready')return;
  if(!(P.cur.reps>=1)){toast('Indique au moins 1 répétition.');return;}
  initAudio();P.phase='count';P.t0=Date.now();P.lastBeep=null;beep(520,120);renderPlayer();
}
function startWork(){
  const P=V.play;
  if(TIMED.includes(P.cur.ex)){P.phase='timed';P.workStart=Date.now();P.timedEnd=P.workStart+P.cur.reps*1000;beep(880,220);buzz(60);say('Allez, tiens la position !',true);renderPlayer();return;}
  P.phase='work';P.workStart=Date.now();P.reps=0;beep(880,220);buzz(60);say('Allez !',true);renderPlayer();
}
function playTap(){
  const P=V.play;if(!P||P.phase!=='work')return;
  P.reps++;beep(700,90);buzz(30);
  if(P.reps>=P.cur.reps){endSet(P.cur.reps);return;}
  speakRep(P.reps,P.cur.reps);
  const r=$('#pl-rep');if(r)r.textContent=P.reps;
  const l=$('#pl-left');if(l)l.textContent=leftTxt(P.cur.reps-P.reps);
}
function playStop(){
  const P=V.play;if(!P)return;
  if(P.phase==='timed'){const el=Math.max(1,Math.round((Date.now()-P.workStart)/1000));endSet(el);return;}
  if(P.phase!=='work')return;
  if(P.reps<1){P.phase='ready';renderPlayer();return;}
  endSet(P.reps);
}
const leftTxt=n=>n===1?'Dernière répétition !':'Encore '+n+' répétitions';
function endSet(reps){
  const P=V.play,nx=pickNext();if(!nx)return;
  const e=nx.e,ns={kg:P.cur.kg,reps},pb=prevBest(e.exId,P.date),before=e.sets.length?Math.max(...e.sets.map(e1)):0,ne=e1(ns);
  P.fbBase=P.cur.kg;P.fbBaseReps=P.cur.reps;
  e.sets.push(ns);nx.w.lastEx=e.exId;P.from=nx.i;P.done++;P.vol+=ns.kg*ns.reps;P.banner='';
  if(pb>0&&ne>pb+0.01&&ne>before+0.01){P.prs++;P.banner='Nouveau record sur '+(exById(e.exId)||{n:''}).n+' !';}
  save();
  P.lastSet={ex:e.exId,kg:ns.kg,reps,ref:ns,fb:null};
  if(reps<P.fbBaseReps)applyFb(1);
  beep(880,450,.2);buzz([200,80,200]);say('Stop. Pose la charge.',true);
  const nx2=pickNext();
  if(!nx2){finishPlay();return;}
  P.restTot=restFor(e.exId,nx2.e.exId!==e.exId)*1000;P.restEnd=Date.now()+P.restTot;P.restStart=Date.now();P.lastBeep=null;P.phase='rest';P.nextSaid=false;
  say((P.banner?'Nouveau record ! ':'')+'Bien joué. Repos '+durSay(Math.round(P.restTot/1000))+'.');
  renderPlayer();
}
function finishPlay(){
  const P=V.play;if(!P)return;
  P.phase='done';beep(660,200);setTimeout(()=>beep(880,400),260);buzz([200,100,200,100,400]);
  say('Séance terminée. Bien joué ! '+P.done+' séries, '+fmtN(P.vol)+' kilos soulevés'+(P.prs?', '+P.prs+' record'+(P.prs>1?'s':''):'')+'.');
  renderPlayer();
}
function playSkipEx(){
  const P=V.play,nx=pickNext();if(!P||!nx)return;
  P.skip[nx.e.exId]=true;enterReady();renderPlayer();
}
function playSkipRest(){const P=V.play;if(!P||P.phase!=='rest')return;enterReady();renderPlayer();}

function plRing(size,sw){
  const r=(size-sw)/2,c=(2*Math.PI*r).toFixed(1),h=size/2;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><defs><linearGradient id="plg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF7A2F"/><stop offset="1" stop-color="#FF3D6E"/></linearGradient></defs><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="${sw}"/><circle id="pl-arc" cx="${h}" cy="${h}" r="${r}" fill="none" stroke="url(#plg)" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="0 ${c}" transform="rotate(-90 ${h} ${h})"/></svg>`;
}
function setArc(p){
  const a=$('#pl-arc');if(!a||typeof a.getAttribute!=='function')return;
  const c=parseFloat(a.getAttribute('stroke-dasharray').split(' ')[1]);
  a.setAttribute('stroke-dasharray',(c*Math.max(0,Math.min(1,p))).toFixed(1)+' '+c);
}
const tgtTxt=c=>TIMED.includes(c.ex)?c.reps+' s':(c.kg>0?nf(c.kg)+' kg × ':'')+c.reps+' rép.';

  let body='';
  const ex=nx?exById(nx.e.exId):null,c=P.cur;

    const warm=(P.done===0&&nx.s===1&&c.kg>0)?`Échauffement conseillé : 1 série de 8 répétitions à ${nf(Math.round(c.kg*0.5/2.5)*2.5)} kg avant de commencer.`:'';

    const recBox=(c.src==='history'||c.src==='estimate')?`<div class="pl-rec"><small>Poids conseillé${dbn?' (par haltère)':''}</small><b>${nf(c.rec)} kg</b><p>${c.why?`<b>${esc(c.why)}</b> `:''}${c.src==='history'?`Légèrement sous ton max (≈ ${nf(c.max||c.rec)} kg pour ${c.reps} reps) : tu finis toutes tes répétitions avec 1 en réserve.`:'Estimation prudente d’après ton poids et ton niveau. Ajuste dès la 1re série : mieux vaut trop léger.'}</p>${c.kg!==c.rec?`<button class="pl-chip" data-act="plrec">Revenir à ${nf(c.rec)} kg</button>`:''}</div>`:'';

    body=`${head}<div class="pl-mid">${FIGS[nx.e.exId]?`<div class="pl-figwrap">${figHTML(nx.e.exId,'pl-fig')}</div>`:''}<p class="pl-lab">${P.done?'Repos terminé : à toi !':'Prépare-toi'}</p>

        <div class="pl-box"><span>${timed?'Durée (secondes)':'Répétitions'}</span><div class="stepper"><button data-act="plstep" data-f="reps" data-d="${timed?'-5':'-1'}" aria-label="Moins">−</button><input id="pl-reps" type="number" inputmode="numeric" min="1" value="${c.reps}" data-pl="reps"><button data-act="plstep" data-f="reps" data-d="${timed?'5':'1'}" aria-label="Plus">+</button></div></div>
      </div>
      <p class="pl-hint">${esc(hint)}</p>${P.mode==='hands'?'<p class="pl-sub" id="pl-auto"></p>':''}</div>
      <button class="pl-go" data-act="plgo">${icon('play',22)} Démarrer la série</button>
      <div class="pl-links">${TECH[nx.e.exId]?`<button class="pl-link" data-act="tech" data-ex="${nx.e.exId}">${icon('info',15)} Technique</button>`:''}${nx.e.sets.length===0&&altsFor(nx.e.exId,P.date).length?`<button class="pl-link" data-act="openswap" data-ex="${nx.e.exId}">${icon('refresh',15)} Remplacer</button>`:''}<button class="pl-link" data-act="plskipex">Passer cet exercice</button></div>`;
  }else if(P.phase==='count'){
    body=`${head}<div class="pl-mid"><p class="pl-lab">Prépare-toi</p><div class="pl-big" id="pl-big">3</div><p class="pl-sub">${esc(tgtTxt(c))}</p></div>`;
  }else if(P.phase==='timed'){
    body=`${head}<div class="pl-mid"><p class="pl-lab">Tiens la position</p>
      <div class="pl-ringwrap">${plRing(260,16)}<div class="pl-center"><b class="pl-t" id="pl-tsec">${c.reps}</b><span class="pl-sub">secondes</span></div></div>
      <p class="pl-sub" style="margin-top:14px">${esc(tgtTxt(c))} visées</p></div>
      <button class="pl-btn ghost" data-act="plstop">Stop, j’arrête ici</button>`;
  }else if(P.phase==='work'){
    const manual=!(tempoEff()>0);
    body=`${head}<div class="pl-mid">${manual
      ?`<button class="pl-tap" data-act="pltap"><b id="pl-rep">${P.reps}</b><span>/ ${c.reps}</span><em>Touche à chaque répétition</em></button>`
      :`<div class="pl-ringwrap">${plRing(260,16)}<div class="pl-center"><div class="cue" id="pl-cue">CONTRÔLE</div><div class="reps"><b id="pl-rep">1</b><span>/ ${c.reps}</span></div></div></div>`}
      <p class="pl-sub" id="pl-left">${leftTxt(c.reps-P.reps)}</p><p class="pl-sub">${esc(tgtTxt(c))}</p></div>
      <button class="pl-btn ghost" data-act="plstop">Stop, j’arrête ici</button>`;
  }else if(P.phase==='rest'&&nx){
    const same=P.lastSet&&P.lastSet.ex===nx.e.exId,nc=same?c:targetFor(nx.e),nex=exById(nx.e.exId);
    body=`<div class="pl-mid"><p class="pl-lab">${P.banner?`<span class="pl-gold">${icon('trophy',18)} ${esc(P.banner)}</span>`:'<span id="pl-st">STOP ! Pose la charge</span>'}</p>
      <div class="pl-ringwrap">${plRing(240,14)}<div class="pl-center"><b class="pl-t" id="pl-t">0:00</b><span class="pl-sub">Repos</span></div></div>

      <div class="pl-fb"><small>Comment c’était ?</small><div class="pl-fbb">${[[-1,'Trop facile'],[0,'Parfait'],[1,'Trop dur']].map(x=>`<button class="${P.lastSet.fb===x[0]?'on':''}" data-act="plfb" data-v="${x[0]}">${x[1]}</button>`).join('')}</div></div></div>
      <div class="pl-btns"><button class="pl-btn ghost" data-act="plplus">+15 s</button><button class="pl-btn" data-act="plskiprest">Passer le repos</button></div>`;
  }else{
    const mn=Math.max(1,Math.round((Date.now()-P.start)/60000));
    body=`<div class="pl-mid"><div class="pl-trophy">${icon('trophy',54)}</div><h1 style="font-size:34px">Bien joué !</h1><p class="pl-sub">Tu as terminé ta séance.</p>
      <div class="pl-stats"><div><b>${P.done}</b><span>séries</span></div><div><b>${fmtN(P.vol)}</b><span>kg soulevés</span></div><div><b>${mn}</b><span>minutes</span></div><div><b>${P.prs}</b><span>record${P.prs>1?'s':''}</span></div></div></div>
      <button class="pl-go" data-act="pldone">Terminer</button>`;
  }
  const conf=P.q?`<div class="pl-confirm"><div><h2>Quitter la séance ?</h2><p>Tes séries validées sont enregistrées.</p><button class="pl-btn" data-act="plquitno">Continuer</button><button class="pl-btn ghost" data-act="plquityes">Quitter</button></div></div>`:'';
  return top+body+conf;
}
function renderPlayer(){
  const el=$('#player');if(!el)return;
  if(!V.play){el.hidden=true;el.innerHTML='';document.body.style.overflow=V.sheet?'hidden':'';return;}
  el.innerHTML=playerHTML();el.hidden=false;document.body.style.overflow='hidden';
  if(V.play.phase==='ready')figStart();
  if(V.play.phase==='rest')playTick();
}
function playTick(){
  const P=V.play;if(!P)return;
  const now=Date.now(),dt=Math.max(0,now-(P.lastTick||now)),set=(id,t)=>{const e=$('#'+id);if(e&&e.textContent!==String(t))e.textContent=t;};
  P.lastTick=now;
  const el=Math.floor((now-P.start)/1000);set('pl-el',Math.floor(el/60)+':'+pad(el%60));
  if(P.phase==='count'){
    const rem=3-Math.floor((now-P.t0)/1000);
    if(rem<=0){startWork();return;}
    if(P.lastBeep!==rem){P.lastBeep=rem;beep(520,120);say(String(rem),true);}
    set('pl-big',rem);
  }else if(P.phase==='work'&&tempoEff()>0){
    const tp=tempoEff(),T=tp*1000,e=now-P.workStart,done=Math.floor(e/T);
    if(done>P.reps){
      P.reps=done;
      if(P.reps>=P.cur.reps){endSet(P.cur.reps);return;}
      beep(700,90);buzz(40);speakRep(P.reps,P.cur.reps);
    }
    const inDown=(e%T)<(tp-1)*1000;
    const cue=$('#pl-cue');
    if(cue){const t=inDown?'CONTRÔLE':(exFam(P.cur.ex)==='pull'?'TIRE':'POUSSE');if(cue.textContent!==t){cue.textContent=t;if(cue.className!==undefined)cue.className='cue '+(inDown?'down':'up');}}
    set('pl-rep',Math.min(P.cur.reps,P.reps+1));set('pl-left',leftTxt(P.cur.reps-P.reps));setArc((e%T)/T);
  }else if(P.phase==='timed'){
    const rem=P.timedEnd-now;
    if(rem<=0){beep(880,300);buzz([200,80,200]);endSet(P.cur.reps);return;}
    set('pl-tsec',Math.ceil(rem/1000));setArc(rem/(P.cur.reps*1000));
  }else if(P.phase==='ready'){
    if(P.autoAt){
      if(V.sheet&&V.sheet.type==='tech')P.autoAt+=dt;
      if(now>=P.autoAt){playGo();return;}
      set('pl-auto','Démarrage automatique dans '+Math.ceil((P.autoAt-now)/1000)+' s');
    }
  }else if(P.phase==='rest'){
    const rem=P.restEnd-now;
    if(rem<=0){
      beep(880,300);buzz([300,100,300]);
      if(P.mode==='hands'){enterReady(true);if(P.phase==='ready')startWork();else renderPlayer();}
      else{enterReady();renderPlayer();}
      return;
    }
    if(!P.banner&&now-P.restStart>2500)set('pl-st','Série validée');
    const s=Math.ceil(rem/1000);set('pl-t',Math.floor(s/60)+':'+pad(s%60));setArc(rem/P.restTot);
    if(P.mode==='hands'&&!P.nextSaid&&s<=15&&P.restTot>=25000){P.nextSaid=true;announceNext();}
    if(s<=3&&P.lastBeep!==s){P.lastBeep=s;beep(520,100);if(P.mode==='hands')say(String(s),true);}
  }
}

/* sauvegarde complète (données + photos de progression) dans un fichier */
async function exportData(){
  let photos=[];try{photos=await allPhotos();}catch(e){}
  const name='forma-sauvegarde-'+today()+'.json';
  const data=JSON.stringify({app:'forma',version:2,exportedAt:new Date().toISOString(),data:S,photos});
  let dl=null;try{dl=(window.claude&&claude.use)?await claude.use('downloads'):null;}catch(e){}
  try{
    if(dl)await dl.save({filename:name,data});
    else{const u=URL.createObjectURL(new Blob([data],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);}
    S.lastBackup=today();S.backupSnooze=null;save();render(true);
    toast('Sauvegarde enregistrée'+(photos.length?' (avec '+photos.length+' photo'+(photos.length>1?'s':'')+')':'')+'.');
  }catch(e){if(!e||e.code!=='declined')toast('Sauvegarde impossible.');}
}
function importData(txt){
  let o;try{o=JSON.parse(txt);}catch(e){toast('Fichier illisible : choisis une sauvegarde Forma (.json).');return;}
  const d=o&&o.app==='forma'?o.data:o;
  if(!d||!Array.isArray(d.workouts)||!Array.isArray(d.meals)){toast('Ce fichier n’est pas une sauvegarde Forma.');return;}
  try{localStorage.setItem(KEY+'-avant-import',JSON.stringify(S));}catch(e){}
  S=merge(d);S.profile.set=true;V.ob=null;if(o.exportedAt)S.lastBackup=String(o.exportedAt).slice(0,10);
  const ph=Array.isArray(o.photos)?o.photos:[];
  Promise.all(ph.map(r=>savePhoto(r).catch(()=>{}))).then(()=>allPhotos()).then(l=>{V.photos=l;render(true);}).catch(()=>{});
  const nw=S.workouts.filter(w=>w.entries.some(e=>e.sets.length)).length,nd=new Set(S.meals.map(m=>m.date)).size;
  save();render(true);toast('Sauvegarde restaurée : '+nw+' séance'+(nw>1?'s':'')+', '+nd+' jour'+(nd>1?'s':'')+' de repas'+(ph.length?', '+ph.length+' photo'+(ph.length>1?'s':''):'')+'.');
}
/* rappel de sauvegarde : dès qu'il y a de vraies données, puis tous les 7 jours */
function backupDue(){
  if(S.demo||!S.profile.set||SYNC.user)return false;
  const nw=S.workouts.filter(w=>w.entries.some(e=>e.sets.length)).length;
  if(nw<2&&S.meals.length<10)return false;
  if(S.backupSnooze&&today()<S.backupSnooze)return false;
  return !S.lastBackup||daysBetween(S.lastBackup,today())>=7;
}
function backupCard(){
  if(!backupDue())return '';
  if(SYNC.avail&&SYNC.ready)return `<div class="banner backup">${icon('cloud',20)}<div class="rt"><b>Ne perds jamais tes données</b><small>Crée un compte gratuit : tout est sauvegardé automatiquement et synchronisé sur tes appareils.</small></div><div class="bkb"><button class="btn sm primary" data-act="authopen" data-m="signup">Créer</button><button class="link" data-act="backupsnooze">Plus tard</button></div></div>`;
  return `<div class="banner backup">${icon('lock',20)}<div class="rt"><b>${S.lastBackup?'Dernière sauvegarde il y a '+daysBetween(S.lastBackup,today())+' jours':'Tes données ne sont pas sauvegardées'}</b><small>Elles sont stockées dans ce navigateur : si tu vides le cache ou changes de téléphone, tu les perds.</small></div><div class="bkb"><button class="btn sm primary" data-act="export">Sauvegarder</button><button class="link" data-act="backupsnooze">Plus tard</button></div></div>`;
}

    return;
  }
  if(ds.onb){V.onbf[ds.onb]=t.value;return;}
  if(ds.bind==='date'||ds.bind==='mdate'){if(t.value)V[ds.bind]=t.value;render(true);}
});
/* lueur qui suit le doigt/curseur sur la carte séance */
document.addEventListener('pointermove',e=>{
  const h=e.target.closest&&e.target.closest('.herocard');if(!h)return;
  const r=h.getBoundingClientRect();
  h.style.setProperty('--mx',((e.clientX-r.left)/r.width*100).toFixed(1)+'%');
  h.style.setProperty('--my',((e.clientY-r.top)/r.height*100).toFixed(1)+'%');
});
render();
checkLoginBonus();checkDailyChallenge();
</script>
