  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A0C11; --surface:#14171F; --surface2:#1D212B; --ink:#F3F5F9; --muted:#8B94A7; --line:#262B37;
    --accent:#FF6A2B; --prot:#5B93FF; --carb:#FFB627; --fat:#FF6B9F; --good:#34D3A0; --warn:#FFA13D; --gold:#FFCB45;
    --shadow:0 0 0 rgba(0,0,0,0);
    --shadow-lift:0 20px 48px rgba(0,0,0,.55);
    --glow:0 0 32px rgba(255,106,43,.28);
  }
}
:root[data-theme="dark"]{
  --bg:#0A0C11; --surface:#14171F; --surface2:#1D212B; --ink:#F3F5F9; --muted:#8B94A7; --line:#262B37;
  --accent:#FF6A2B; --prot:#5B93FF; --carb:#FFB627; --fat:#FF6B9F; --good:#34D3A0; --warn:#FFA13D; --gold:#FFCB45;
  --shadow:0 0 0 rgba(0,0,0,0);
  --shadow-lift:0 20px 48px rgba(0,0,0,.55);
  --glow:0 0 32px rgba(255,106,43,.28);
}
body{position:relative}
body::before{content:"";position:fixed;z-index:0;top:-10%;left:50%;width:120vw;max-width:900px;height:60vh;transform:translateX(-50%);background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 20%,transparent),transparent 72%);filter:blur(40px);pointer-events:none;animation:fx-drift 14s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){body::before{animation:none}}
@keyframes fx-drift{from{transform:translateX(-54%) translateY(0)}to{transform:translateX(-46%) translateY(3%)}}
main,nav,#rest,.player,.sheetp,.backdrop,#toast,.fab{position:relative;z-index:1}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
button{font-family:inherit}
main{max-width:520px;margin:0 auto;padding:16px 16px 160px}
h1,h2,h3,p{margin:0}
h1{font-family:var(--font-d);font-size:30px;font-weight:700;letter-spacing:-.01em;line-height:1.08}
h2{font-family:var(--font-d);font-size:18px;font-weight:700;letter-spacing:-.005em}
h3{font-family:var(--font-d);font-size:16px;font-weight:700}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
.muted{color:var(--muted)}
.ic{flex:none}
.sect{display:flex;justify-content:space-between;align-items:center;margin:28px 2px 10px}
.sect button{background:none;border:0;color:var(--ink);font-weight:700;font-size:14px;cursor:pointer;padding:4px}

/* cartes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-top:12px}
.card:first-child{margin-top:0}

/* en-tête */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.avatar{width:44px;height:44px;border-radius:13px;background:var(--grad);color:#fff;font-family:var(--font-d);font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;border:0;cursor:pointer;flex:none}
.pillrow{display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:inherit;color:inherit;cursor:default;font-weight:700;font-size:13px}
button.pill{cursor:pointer}
.pill.gold{color:var(--gold)}

/* semaine */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--ink)}
.wd span{font-size:11px;color:var(--muted);font-weight:600}
.wd b{font-size:16px;font-weight:800}
.wd i{width:6px;height:6px;border-radius:50%;background:transparent;margin-top:2px}
.wd.on i{background:var(--accent)}
.wd.now{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.wd.now span{color:var(--bg);opacity:.7}
.wd.now.on i{background:var(--bg)}

/* nutrition */
.ringwrap{position:relative;width:168px;height:168px;margin:2px auto 0}
.ringc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringc .num{font-family:var(--font-d);font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1}
.ringc .lab{font-size:12px;color:var(--muted);font-weight:600;margin-top:4px}
.nutstats{display:flex;justify-content:center;gap:34px;margin:14px 0 4px}
.nutstats div{text-align:center}
.nutstats b{display:block;font-size:17px;font-weight:800}
.nutstats span{font-size:12px;color:var(--muted);font-weight:600}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.macro .mh{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:6px}
.macro .mh span:last-child{color:var(--muted);font-weight:600}
.mbar{height:7px;border-radius:4px;background:var(--surface2);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:4px;background:var(--c)}
.macro small{display:block;margin-top:5px;font-size:12px;color:var(--muted);font-weight:600}

/* carte séance (hero) */
.herocard{position:relative;overflow:hidden;border-radius:26px;padding:22px 20px;background:var(--grad);background-size:160% 160%;color:#fff;margin-top:12px;box-shadow:0 20px 40px color-mix(in srgb,var(--accent) 30%,transparent);animation:fx-gradient 9s ease-in-out infinite}
.herocard::before{content:"";position:absolute;inset:0;background:radial-gradient(420px circle at var(--mx,70%) var(--my,0%),rgba(255,255,255,.22),transparent 60%);pointer-events:none;transition:background .2s}
.herocard::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.06) 0 2px,transparent 2px 34px);pointer-events:none}
.herocard .tag{display:inline-block;background:rgba(255,255,255,.2);border-radius:8px;padding:4px 11px;font-size:12px;font-weight:700;position:relative}
.herocard h2{font-family:var(--font-d);font-size:25px;font-weight:700;margin:12px 0 4px;letter-spacing:-.01em;position:relative}
.herocard p{opacity:.92;font-size:14px;position:relative;max-width:85%}
.herocard .btn{margin-top:16px;position:relative}
@media (prefers-reduced-motion:reduce){.herocard{animation:none}}
@keyframes fx-gradient{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

/* tuiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);transition:transform .18s cubic-bezier(.2,.8,.2,1),border-color .2s,box-shadow .2s}
.perslist{border-top:1px solid var(--line)}
.accentgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.accentsw.locked{opacity:.55}
.accentsw,.avatarsw{position:relative}
.lockbadge{position:absolute;bottom:-3px;right:-3px;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--surface)}
.avatar.sm{width:32px;height:32px;font-size:14px;border-radius:10px;flex:none}
.framepreview{width:32px;height:32px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.avatar.frame-gold,.framepreview.frame-gold{box-shadow:0 0 0 3px var(--gold)}
.avatar.frame-neon,.framepreview.frame-neon{box-shadow:0 0 0 3px #00eaff,0 0 14px 2px color-mix(in srgb,#00eaff 60%,transparent)}
.avatar.frame-fire,.framepreview.frame-fire{box-shadow:0 0 0 3px var(--accent);animation:fx-flame 1.4s ease-in-out infinite}
[data-accent-anim="1"] .avatar{background-size:250% 250%;animation:fx-gradientshift 4s ease infinite}
@keyframes fx-gradientshift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.confetti-burst{position:relative;height:0;overflow:visible}
.confetti-burst i{position:absolute;top:-10px;width:8px;height:12px;border-radius:2px;animation-name:fx-confetti-fall;animation-timing-function:ease-in;animation-fill-mode:forwards}
@keyframes fx-confetti-fall{to{transform:translateY(140px) rotate(340deg);opacity:0}}
.fw-burst{position:relative;height:0;overflow:visible;display:flex;justify-content:center}
.fw-center{position:relative;width:0;height:0;top:20px}
.fw-center i{position:absolute;width:6px;height:6px;border-radius:50%;animation:fx-fw-burst .9s ease-out forwards}
@keyframes fx-fw-burst{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(calc(cos(var(--ang)) * var(--dist)),calc(sin(var(--ang)) * var(--dist))) scale(.2);opacity:0}}
.sparkle-burst{position:relative;height:70px;overflow:visible}
.sparkle-burst i{position:absolute;color:var(--gold);animation:fx-sparkle-twinkle 1.4s ease-in-out infinite}
@keyframes fx-sparkle-twinkle{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:1;transform:scale(1.1)}}
.avatarsw{width:100%;aspect-ratio:1;border-radius:50%;border:2px solid var(--line);background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;color:var(--muted)}
.avatarsw.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,var(--surface2))}
.avatarsw.locked{opacity:.55}
.shoplabels{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:6px}
.shoplabels span{font-size:10.5px;color:var(--muted);text-align:center;font-weight:600}
.coinbar{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--gold) 18%,var(--surface2));color:var(--gold);font-weight:800;font-size:14px;padding:8px 14px;border-radius:999px;margin-bottom:14px}
.coinbar.sm{margin-bottom:0;padding:6px 12px;font-size:13px;flex:none}
.cmpwrap{position:relative;width:100%;aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:#111;user-select:none}
.heatgrid{display:flex;gap:3px}
.heatcol{display:flex;flex-direction:column;gap:3px}
.heatcell{width:11px;height:11px;border-radius:3px;background:var(--surface2);display:block}
.heatcell.lvl1{background:color-mix(in srgb,var(--accent) 30%,var(--surface2))}
.heatcell.lvl2{background:color-mix(in srgb,var(--accent) 55%,var(--surface2))}
.heatcell.lvl3{background:color-mix(in srgb,var(--accent) 80%,var(--surface2))}
.heatcell.lvl4{background:var(--accent)}
.heatcell.future{opacity:.35}
.micbtn{position:absolute;right:10px;bottom:10px;width:36px;height:36px;border-radius:50%;border:0;background:var(--surface2);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.micbtn.on{background:var(--accent);color:#fff;animation:fx-pulse 1.2s ease-in-out infinite}
@keyframes fx-pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}50%{box-shadow:0 0 0 8px transparent}}
.cmpwrap img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.cmp-beforewrap{position:absolute;top:0;left:0;height:100%;overflow:hidden;width:50%}
.cmp-handle{position:absolute;top:0;bottom:0;left:50%;width:3px;background:#fff;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:2px;pointer-events:none;animation:fx-handlehint .9s ease-in-out .3s 1}
@keyframes fx-handlehint{0%,100%{left:50%}40%{left:42%}75%{left:56%}}
.cmp-handle svg{background:#fff;color:#111;border-radius:50%;padding:6px;width:26px;height:26px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.accentsw{width:100%;aspect-ratio:1;border-radius:50%;border:2px solid transparent;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;box-shadow:var(--shadow)}
.accentsw.on{border-color:var(--ink)}
.persrow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:18px 2px;color:var(--ink);cursor:pointer;text-align:left;font:inherit}
.persrow .prt b{font-family:var(--font-d);font-size:18px;font-weight:600;display:block}
.persrow .prt small{color:var(--muted);font-size:13px;font-weight:500;display:block;margin-top:3px}
.persrow svg{color:var(--muted);flex:none}
.tile .tv{font-family:var(--font-d);font-size:27px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.tile .tv small{font-family:var(--font);font-size:14px;color:var(--muted);font-weight:700;margin-left:3px}
.tile .tl{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.tile .tt{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:6px}
@media (hover:hover){
  .tile:hover,.card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 40%,var(--line));box-shadow:0 14px 30px rgba(10,14,25,.09)}
  :root[data-theme="dark"] .tile:hover,:root[data-theme="dark"] .card:hover{box-shadow:0 14px 30px rgba(0,0,0,.4)}
}
.card{transition:transform .18s cubic-bezier(.2,.8,.2,1),border-color .2s,box-shadow .2s}

/* boutons */
.btn{font:inherit;font-weight:700;font-size:15px;min-height:48px;padding:0 20px;border-radius:12px;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface2);color:var(--ink)}
.btn.primary{background:var(--grad);color:#fff;position:relative;overflow:hidden;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.primary::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 48%,transparent 66%);background-size:220% 100%;background-position:150% 0;transition:background-position .7s ease}
.btn.primary:hover::after,.btn.primary:active::after{background-position:-40% 0}
.gbtn{margin-top:10px;border:1.5px solid var(--line);gap:10px;font-weight:700;color:var(--ink)!important}
.orsep{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--muted);font-size:12.5px;font-weight:700}
.orsep::before,.orsep::after{content:"";flex:1;height:1px;background:var(--line)}
.btn.white{background:#fff;color:#E23A55}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.danger{background:transparent;border:1.5px solid var(--warn);color:var(--warn)}
.btn.block{display:flex;width:100%}
.btn.stack{justify-content:flex-start;padding:12px 20px;text-align:left;min-height:60px}
.btn.stack span{display:flex;flex-direction:column;line-height:1.25}
.btn.stack small{font-size:12.5px;font-weight:600;opacity:.85}
.btn.sm{min-height:38px;padding:0 14px;font-size:13px;border-radius:10px}
.btn:active{transform:scale(.98)}
@media (hover:hover){
  .btn.primary:hover{box-shadow:0 10px 26px color-mix(in srgb,var(--accent) 48%,transparent);transform:translateY(-1px)}
}
.ibtn{width:38px;height:38px;border-radius:11px;background:var(--surface2);border:0;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.ibtn:hover{color:var(--warn)}
.addb{width:40px;height:40px;border-radius:13px;background:var(--grad);color:#fff;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 40%,transparent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* champs */
label.f{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px}
input,select{font:inherit;color:var(--ink);background:var(--surface2);border:1.5px solid transparent;border-radius:12px;padding:0 12px;min-height:46px;width:100%}
input:focus,select:focus{border-color:var(--accent);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pfields{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.pf{display:flex;flex-direction:column;gap:6px}
.pf2col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pf .f{display:flex;align-items:center;gap:6px}
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:14px;padding:10px 4px;border-radius:11px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.datenav{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.datenav button{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.datenav input{flex:1;text-align:center;font-weight:700;background:var(--surface);border:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* modèles */
.tpls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tpl{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;color:var(--ink);box-shadow:var(--shadow)}
.tpl b{font-family:var(--font-d);display:block;font-size:17px;font-weight:700}
.tpl span{display:block;font-size:12px;color:var(--muted);margin-top:2px;font-weight:600}
.tpl em{display:block;font-style:normal;font-size:12px;color:var(--ink);font-weight:700;margin-top:8px}

/* exercices */
.mico{width:42px;height:42px;border-radius:12px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);display:flex;align-items:center;justify-content:center;flex:none}
.tnum{width:42px;height:42px;border-radius:12px;background:var(--c);color:#fff;font-family:var(--font-d);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;flex:none}
.exh{display:flex;align-items:center;gap:12px}
.exn{flex:1;min-width:0}
.exn h3{font-family:var(--font-d);font-size:17px;font-weight:700;letter-spacing:-.005em}
.exn span{font-size:13px;color:var(--muted);font-weight:600}
.prev{background:var(--surface2);border-radius:10px;padding:10px 12px;margin:14px 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.prev b{color:var(--ink)}
.prev .goal{display:flex;align-items:center;gap:6px;margin-top:4px;color:var(--ink);font-weight:800}
.sets{margin-top:6px}
.set{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.set .n{width:28px;height:28px;border-radius:8px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--muted)}
.set .v{font-family:var(--font-d);font-size:18px;font-weight:700;letter-spacing:0;white-space:nowrap}
.set .v small{font-size:13px;color:var(--muted);font-weight:700}
.set .e{color:var(--muted);font-size:12px;font-weight:600}
.prtag{display:inline-flex;align-items:center;gap:4px;background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold);border-radius:8px;padding:3px 8px;font-weight:800;font-size:11px}
.set .x{width:32px;height:32px;border:0;background:none;color:var(--muted);border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.set .x:hover{color:var(--warn)}
.addrow{display:grid;grid-template-columns:1fr 1fr 52px;gap:10px;align-items:end;margin-top:14px}
.stepper{display:flex;align-items:center;background:var(--surface2);border-radius:14px;overflow:hidden}
.stepper button{width:38px;height:46px;border:0;background:none;color:var(--ink);font-size:20px;font-weight:700;cursor:pointer;flex:none}
.stepper input{background:transparent;text-align:center;font-weight:800;font-size:17px;padding:0;min-width:0;border-radius:0}
.okbtn{width:52px;height:46px;border-radius:14px;background:var(--grad);color:#fff;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.dashed{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;min-height:54px;border:2px dashed var(--line);background:transparent;color:var(--ink);font-weight:800;font-size:15px;border-radius:18px;cursor:pointer}
.sumrow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}

/* listes */
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.item .t{flex:1;min-width:0}
.item .t b{font-weight:700;display:block;font-size:14px}
.item .t span{font-size:12px;color:var(--muted);font-weight:600}

/* favoris, plan, courses, voix */
.nm-links{display:flex;gap:18px;margin-top:8px}
.nm-links .link,.card .nm-links .link{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--ink);font-weight:700;font-size:13px;cursor:pointer;padding:6px 0}
.favb.on{color:var(--gold)}
.favb.on svg{fill:currentColor}
.gopt .gh b{flex:1}
.shop-h{margin:18px 0 2px;font-size:15px;font-weight:800}
.chk{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.chk.on{background:var(--good);border-color:var(--good)}
.prepstep{padding-left:20px;margin:12px 0 0}
.prepstep li{margin:6px 0}
.sheetp.still{animation:none}
.pl-mode{display:flex;align-items:center;gap:6px;height:42px;padding:0 12px;border-radius:14px;background:rgba(255,255,255,.12);border:0;color:#fff;font:inherit;font-weight:700;font-size:13px;cursor:pointer;flex:none}
/* ---- technique / schémas ---- */
svg.fig{width:100%;height:auto;display:block}
svg.fig .b{fill:none;stroke:var(--ink);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;opacity:.92}
svg.fig .b.w{stroke:var(--accent)}
svg.fig .b.f{stroke:var(--muted);opacity:.5}
svg.fig .hd{fill:var(--ink)}
svg.fig .p,svg.fig .pk{fill:none;stroke:var(--muted);stroke-width:3;stroke-linecap:round}
svg.fig .pl{stroke:var(--line);stroke-width:3;stroke-linecap:round}
svg.fig .pb{stroke:var(--muted);stroke-width:5;stroke-linecap:round;opacity:.6}
svg.fig .pd{stroke:var(--muted);stroke-width:4;stroke-linecap:round}
svg.fig .pc{fill:none;stroke:var(--muted);stroke-width:4}
svg.fig .pf{fill:var(--line)}
svg.fig .fl{stroke:var(--line);stroke-width:2}
.techfig{padding:6px 10px;margin-top:6px}
.tech-h{font-size:15px;font-weight:800;margin:20px 0 6px}
.techp{font-size:14px;color:var(--muted);font-weight:500;line-height:1.5}
.techl{padding-left:20px;margin:0;font-size:14px;line-height:1.45}
.techl li{margin:7px 0}
.techl.tl-err li::marker{color:var(--warn)}
.player svg.fig .b{stroke:#fff;opacity:.92}
.player svg.fig .b.w{stroke:#FF8A4C}
.player svg.fig .b.f{stroke:#fff;opacity:.3}
.player svg.fig .hd{fill:#fff}
.player svg.fig .p,.player svg.fig .pk,.player svg.fig .pc,.player svg.fig .pd{stroke:rgba(255,255,255,.55)}
.player svg.fig .pb{stroke:rgba(255,255,255,.4)}
.player svg.fig .pl,.player svg.fig .fl{stroke:rgba(255,255,255,.18)}
.player svg.fig .pf{fill:rgba(255,255,255,.16)}
.pl-figwrap{width:100%;max-width:300px}
.pl-fig{max-height:17vh}
@media (max-height:760px){.pl-figwrap{display:none}}
.pl-links{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
.pl-links .pl-link{display:inline-flex;align-items:center;gap:6px}
.pl-prog{display:flex;flex-direction:column;line-height:1.25;white-space:nowrap}
.pl-prog b{font-size:14px;font-weight:800}
.pl-prog span{font-size:12.5px;font-weight:700;opacity:.7}
.vv{flex:1;display:flex;flex-direction:column;min-width:0;background:none;border:0;padding:0;text-align:left;font:inherit;cursor:pointer;color:inherit}
.set.editing{background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:12px;margin:0 -10px;padding-left:10px;padding-right:10px}
.editlab{font-size:12.5px;font-weight:800;color:var(--ink);margin:12px 0 -2px}
.ins-act{margin-top:8px;background:var(--surface2);border:0;border-radius:10px;padding:8px 14px;font-weight:700;font-size:13px;color:var(--ink);cursor:pointer}
.link{background:none;border:0;color:var(--ink);font:inherit;font-weight:700;font-size:14px;cursor:pointer;padding:8px 4px}
@media (hover:hover){.link:hover{color:var(--accent)}}
.chk{display:flex;gap:10px;align-items:center;margin-top:14px;font-weight:600;font-size:14px}
.chk input{width:22px;height:22px;min-height:0;accent-color:var(--accent)}
.fibline{margin:12px 0 0;font-size:13px;font-weight:600;color:var(--muted)}
.fibline b{color:var(--ink)}

.hyh{display:flex;align-items:center;gap:12px}
.hyh h3{font-size:15px;font-weight:800}
.hyh small{color:var(--muted);font-size:12.5px;font-weight:700}
.hybar{height:10px;border-radius:6px;background:var(--surface2);margin-top:12px;overflow:hidden}
.hybar i{display:block;height:100%;background:linear-gradient(90deg,#3EC1E8,#4C8DFF);border-radius:6px;transition:width .3s}

.recapcard{background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 12%,var(--surface)),var(--surface))}
.rch{display:flex;align-items:center;gap:12px}
.rch h3{font-size:15px;font-weight:800}
.rch small{color:var(--muted);font-size:12.5px;font-weight:700}
.rctiles{display:flex;gap:0;margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.rctiles div{flex:1;text-align:center}
.rctiles b{display:block;font-size:20px;font-weight:800}
.rctiles span{font-size:11.5px;color:var(--muted);font-weight:700}
.rcmore{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:14px;background:none;border:0;border-top:1px solid var(--line);padding-top:12px;color:var(--ink);font-weight:800;font-size:14px;cursor:pointer}

/* ================= Animations & interactions ================= */
/* retour tactile : tout ce qui se touche s'enfonce légèrement */
.btn,.ibtn,.chip,.wd,.tpl,.okbtn,.addb,.goal,.lrow,button.ins,.fab,nav button .pl,.hist,.prow,.seg button,.stepper button,.datenav button,.gopt,.recrow,.persrow,.accentsw,.avatarsw,.settile{transition:transform .14s cubic-bezier(.3,.7,.4,1),background-color .2s,color .2s,border-color .2s,box-shadow .2s}
.ibtn:active,.chip:active,.wd:active,.tpl:active,.okbtn:active,.addb:active,.goal:active,.lrow:active,button.ins:active,.fab:active,nav button:active .pl,.hist:active,.prow:active,.seg button:active,.stepper button:active,.datenav button:active,.persrow:active,.accentsw:active,.avatarsw:active,.settile:active{transform:scale(.93)}
.tpl:active,button.ins:active,.goal:active,.lrow:active,.hist:active,.prow:active{transform:scale(.97)}
.stepper button:active{transform:scale(.8)}
.herocard .btn svg{transition:transform .2s}
.herocard .btn:hover svg,.herocard .btn:active svg{transform:translateX(4px)}
.fab svg{transition:transform .5s cubic-bezier(.3,.7,.4,1.4)}
.fab:hover svg,.fab:active svg{transform:rotate(90deg) scale(1.15)}
#toast{transform:translate(-50%,14px) scale(.96);transition:opacity .18s,transform .3s cubic-bezier(.2,.9,.3,1.25)}
#toast.show{transform:translate(-50%,0) scale(1)}

/* « Forma écrit… » */
.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.35}
.thinking{background:linear-gradient(90deg,var(--muted) 0%,var(--muted) 40%,var(--accent) 50%,var(--muted) 60%,var(--muted) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent !important}

/* particules de record */
.fx-bit{position:fixed;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:60}
.fx-ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.25;pointer-events:none;transform:scale(0)}

@media (prefers-reduced-motion:no-preference){
  /* changement d'onglet : le contenu glisse doucement */
  main.enter{animation:fx-rise .34s cubic-bezier(.2,.8,.2,1) both}
  nav.enter button[aria-current="page"] .pl{animation:fx-pill .38s cubic-bezier(.3,.8,.3,1.4) both}
  nav.enter button[aria-current="page"] .pl svg{animation:fx-hop .45s cubic-bezier(.3,.8,.3,1.4) both}
  /* jauges qui se remplissent */
  main.enter .ringwrap svg circle:last-of-type{animation:fx-ring 1s cubic-bezier(.25,.8,.25,1) both .08s}
  main.enter .mbar i,main.enter .vbar i,main.enter .bprog i,main.enter .hybar i{transform-origin:left;animation:fx-grow .8s cubic-bezier(.25,.8,.25,1) both .15s}
  main.enter .wd{animation:fx-pop .38s cubic-bezier(.3,.8,.3,1.3) both}
  main.enter .wd:nth-child(2){animation-delay:.03s}main.enter .wd:nth-child(3){animation-delay:.06s}main.enter .wd:nth-child(4){animation-delay:.09s}
  main.enter .wd:nth-child(5){animation-delay:.12s}main.enter .wd:nth-child(6){animation-delay:.15s}main.enter .wd:nth-child(7){animation-delay:.18s}
  main.enter svg.chart .l{stroke-dasharray:2000;animation:fx-line 1.1s ease-out both .1s}
  main.enter .pill.gold svg{animation:fx-flame 1.2s ease-in-out 2}
  /* feuilles */
  #sheet:has(.sheetp:not(.still)) .backdrop{animation:fx-fade .22s ease-out both}
  .sheetp{animation-timing-function:cubic-bezier(.2,.9,.3,1.1)}
  /* chat */
  .typing i{animation:fx-dot 1.1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  .bub.fresh{animation:fx-bub .32s cubic-bezier(.3,.8,.3,1.2) both}
  .bub.me.fresh{transform-origin:bottom right}.bub.bot.fresh{transform-origin:bottom left}
  .thinking{animation:fx-sheen 1.6s linear infinite}
  /* séance */
  .set.fresh{animation:fx-set .45s cubic-bezier(.3,.8,.3,1.25) both}
  .set.fresh .v{animation:fx-num .5s cubic-bezier(.3,.8,.3,1.5) both .05s}
  .okbtn.done{animation:fx-done .5s cubic-bezier(.3,.8,.3,1.4)}
  .prtag.fresh{animation:fx-pr .7s cubic-bezier(.3,.8,.3,1.6) both .1s}
  .item.fresh{animation:fx-item .5s ease-out both}
  .fab{animation:fx-fab .5s cubic-bezier(.3,.8,.3,1.3) both .2s}
  .goal.on .rd{animation:fx-check .35s cubic-bezier(.3,.8,.3,1.6)}
  .card.ins-new,.ins.fresh{animation:fx-rise .4s ease-out both}
  main.enter .heatcell{animation:fx-pop .3s cubic-bezier(.3,.8,.3,1.3) both;animation-delay:calc(var(--i,0)*3ms)}
}
@keyframes fx-rise{from{opacity:0;transform:translateY(10px)}}
@keyframes fx-fade{from{opacity:0}}
@keyframes fx-pill{from{transform:scale(.6);opacity:.3}}
@keyframes fx-hop{40%{transform:translateY(-3px) scale(1.12)}}
@keyframes fx-ring{from{stroke-dasharray:0 1000}}
@keyframes fx-grow{from{transform:scaleX(0)}}
@keyframes fx-pop{from{opacity:0;transform:translateY(8px) scale(.9)}}
@keyframes fx-line{from{stroke-dashoffset:2000}}
@keyframes fx-flame{50%{transform:scale(1.25) rotate(-8deg)}}
@keyframes fx-dot{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
@keyframes fx-bub{from{opacity:0;transform:scale(.85) translateY(6px)}}
@keyframes fx-sheen{from{background-position:100% 0}to{background-position:-150% 0}}
@keyframes fx-set{from{opacity:0;transform:translateY(-10px);background:color-mix(in srgb,var(--accent) 16%,transparent)}60%{background:color-mix(in srgb,var(--accent) 10%,transparent)}}
@keyframes fx-num{from{transform:scale(.6);opacity:0}}
@keyframes fx-done{30%{transform:scale(1.18)}60%{transform:scale(.95)}}
@keyframes fx-pr{0%{transform:scale(0) rotate(-12deg)}60%{transform:scale(1.25) rotate(4deg)}100%{transform:scale(1)}}
@keyframes fx-item{from{background:color-mix(in srgb,var(--accent) 14%,transparent)}}
@keyframes fx-fab{from{opacity:0;transform:translateY(20px) scale(.8)}}
@keyframes fx-check{from{transform:scale(.4)}}

/* hydratation en verres */
.glasses{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px 4px;margin-top:14px}
.glass{background:none;border:0;padding:4px 0;cursor:pointer;display:flex;justify-content:center;border-radius:10px;transition:transform .14s cubic-bezier(.3,.7,.4,1)}
.glass:active{transform:scale(.85)}
.glass .gs{fill:none;stroke:var(--line);stroke-width:2;stroke-linejoin:round}
.glass .gw{fill:var(--prot);opacity:0;transform-origin:50% 100%;transform:scaleY(0);transition:opacity .2s,transform .3s}
.glass.on .gs{stroke:var(--prot)}
.glass.on .gw{opacity:.9;transform:scaleY(1)}
.glass.extra .gs{stroke-dasharray:3 3}
.glass:not(.on):hover .gw{opacity:.2;transform:scaleY(.5)}
@media (prefers-reduced-motion:no-preference){
  .glass.fill{animation:fx-glass .45s cubic-bezier(.3,.8,.3,1.4) both}
  .glass.fill .gw{animation:fx-water .6s cubic-bezier(.25,.8,.25,1.1) both}
  main.enter .glass.on .gw{animation:fx-water .6s cubic-bezier(.25,.8,.25,1) both .15s}
}

@keyframes fx-water{from{transform:scaleY(0)}}

<script>
/* ================= utilitaires ================= */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const today=()=>isoOf(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return isoOf(d);};
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const fmt=(s,o)=>parse(s).toLocaleDateString('fr-FR',o||{weekday:'short',day:'numeric',month:'short'});
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r0=Math.round,r1=n=>Math.round(n*10)/10;
const nf=n=>String(r1(n)).replace('.',',');
const fmtN=n=>Math.round(n).toLocaleString('fr-FR');
const num=v=>{const x=parseFloat(String(v).replace(',','.'));return isNaN(x)?NaN:x;};
const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const weekStart=d=>addDays(d,-((parse(d).getDay()+6)%7));

/* ---- guide d'installation / prise en main ---- */
let DEFERRED_INSTALL=null;
window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();DEFERRED_INSTALL=e;});
function isStandalone(){try{return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;}catch(e){return false;}}
function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent||'');}
function isAndroid(){return /android/i.test(navigator.userAgent||'');}
/* ---- dictée vocale (saisie "Dis-le à Forma") ---- */
const SPEECH=window.SpeechRecognition||window.webkitSpeechRecognition||null;
let RECOG=null,RECOG_ON=false;
function toggleListen(){RECOG_ON?stopListen():startListen();}
function startListen(){
  if(!SPEECH||!V.sheet)return;
  try{

function urlB64ToUint8Array(base64String){

/* Stockage de session via IndexedDB plutôt que localStorage : sur iOS, une web app
   ajoutée à l'écran d'accueil et fermée complètement (balayée dans le multitâche) peut
   perdre des données localStorage écrites juste avant la fermeture — limite connue de
   WebKit, pas garantie corrigée à 100%, mais IndexedDB s'est montré nettement plus fiable
   dans ce cas précis. On retombe sur localStorage si IndexedDB est indisponible. */
const idbAuthStorage=(()=>{
  const DB='forma-auth-db',STORE='kv';
  const hasIDB=typeof indexedDB!=='undefined';
  const openDB=()=>new Promise((res,rej)=>{
    const rq=indexedDB.open(DB,1);
    rq.onupgradeneeded=()=>{if(!rq.result.objectStoreNames.contains(STORE))rq.result.createObjectStore(STORE);};
    rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);
  });
  if(!hasIDB)return undefined;
  return{
    async getItem(key){
      try{const db=await openDB();return await new Promise((res)=>{
        const tx=db.transaction(STORE,'readonly'),rq=tx.objectStore(STORE).get(key);
        rq.onsuccess=()=>res(rq.result==null?null:rq.result);rq.onerror=()=>res(null);
      });}catch(e){try{return localStorage.getItem(key);}catch(_){return null;}}
    },
    async setItem(key,value){
      try{const db=await openDB();await new Promise((res)=>{
        const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(value,key);
        tx.oncomplete=res;tx.onerror=res;
      });}catch(e){}
      try{localStorage.setItem(key,value);}catch(_){}
    },
    async removeItem(key){
      try{const db=await openDB();await new Promise((res)=>{
        const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(key);
        tx.oncomplete=res;tx.onerror=res;
      });}catch(e){}
      try{localStorage.removeItem(key);}catch(_){}
    }
  };
})();

function mergeStates(a,b){
  const out=Object.assign({},b,a);
  const byKey=(x,y,k)=>{const m=new Map();(y||[]).forEach(i=>m.set(k(i),i));(x||[]).forEach(i=>m.set(k(i),i));return [...m.values()];};
  ['workouts','meals','customEx','favs','customFoods'].forEach(f=>{if(Array.isArray(a[f])||Array.isArray(b[f]))out[f]=byKey(a[f],b[f],i=>i&&(i.id||i.n||i.name||JSON.stringify(i)));});
  out.bodyweights=byKey(a.bodyweights,b.bodyweights,i=>i.date);
  const byDate={};(out.workouts||[]).forEach(w=>{const c=byDate[w.date];const n=w.entries.reduce((s,e)=>s+e.sets.length,0);if(!c||n>c.n)byDate[w.date]={w,n};});

async function pushNow(){

      if(error)throw error;
      if(data&&data.length){m.version=data[0].version;m.dirty=false;sMetaSave();setStatus('ok');}
      else{SYNC.busy=false;await pullNow(true);return;}
    }else{
      const r=await fetchRemote();
      if(r){SYNC.busy=false;await pullNow(true);return;}
      const {error}=await SYNC.sb.from('user_data').insert({user_id:uid,state:S,version:1,device:dev});

async function pullNow(conflict){

  if(S.demo){setStatus('ok');return;}
  if(SYNC.busy){SYNC.again=true;return;}
  SYNC.busy=true;setStatus('sync');
  const m=sMeta();
  try{
    const r=await fetchRemote();
    SYNC.busy=false;
    if(!r){if(!S.demo&&S.profile.set){m.uid=SYNC.user.id;m.version=0;sMetaSave();await pushNow();}else setStatus('ok');return;}
    if(m.uid===SYNC.user.id&&!S.profile.set){applyRemote(r.state,r.version);setStatus('ok');}
    else if(m.uid===SYNC.user.id&&r.version===m.version){setStatus('ok');if(m.dirty)await pushNow();}
    else if(m.uid===SYNC.user.id&&(!m.dirty||!S.profile.set)){applyRemote(r.state,r.version);setStatus('ok');}
    else if(m.uid===SYNC.user.id){
      /* les deux côtés ont changé : on fusionne puis on renvoie */
      SYNC.applying=true;S=merge(mergeStates(S,r.state));SYNC.applying=false;
      try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}

    }else{
      /* premier passage de ce compte sur cet appareil */
      if(hasLocalData())openSheet({type:'syncchoice',remote:r});

function friendlyErr(e){

  if(/already registered|already exists/i.test(t))return 'Un compte existe déjà avec cet e-mail : connecte-toi.';
  if(/Email not confirmed/i.test(t))return 'Confirme d’abord ton adresse : clique sur le lien reçu par e-mail.';
  if(/at least 6|Password should be|weak/i.test(t))return 'Mot de passe trop court : au moins 8 caractères.';
  if(/rate limit|too many|security purposes/i.test(t))return 'Trop de tentatives : réessaie dans quelques minutes.';
  if(/invalid.*email|Unable to validate email/i.test(t))return 'Adresse e-mail invalide.';
  if(/Failed to fetch|NetworkError|network/i.test(t))return 'Pas de connexion internet.';
  if(/same.*password|different from the old/i.test(t))return 'Choisis un mot de passe différent de l’ancien.';
  return 'Erreur : '+t.slice(0,120);
}

function authSheet(s){
  const m=s.mode||'login';
  const title={login:'Se connecter',signup:'Créer un compte',reset:'Mot de passe oublié'}[m];
  const cooldown=s.resendAt?Math.max(0,30-Math.floor((Date.now()-s.resendAt)/1000)):0;
  const resendBtn=`<button class="link" data-act="resendconfirm" ${(s.resendBusy||cooldown>0)?'disabled':''} style="margin-top:10px">${s.resendBusy?'Envoi…':cooldown>0?`Renvoyer (${cooldown}s)`:'Renvoyer le mail'}</button>`;
  const body=s.done?`<div class="authdone">${icon('ok',40)}<p>${s.done}</p></div>${m==='signup'?resendBtn:''}<button class="btn primary block" style="margin-top:14px" data-act="${m==='signup'?'authopen':'closesheet'}" data-m="login">${m==='signup'?'J’ai confirmé, me connecter':'Fermer'}</button>`:
  `<p class="sub" style="margin-bottom:14px">${m==='signup'?'Tes données actuelles seront enregistrées sur ce compte.':m==='reset'?'Indique ton e-mail : tu recevras un lien pour choisir un nouveau mot de passe.':'Retrouve tes données sur cet appareil.'}</p>
    ${m!=='reset'?`${googleBtn()}<div class="orsep"><span>ou</span></div>`:''}
    <label class="f" for="aem">E-mail</label><input id="aem" type="email" autocomplete="email" inputmode="email" value="${esc(s.email||'')}" placeholder="toi@exemple.fr">
    ${m!=='reset'?`<label class="f" for="apw" style="margin-top:12px">Mot de passe</label><input id="apw" type="password" autocomplete="${m==='signup'?'new-password':'current-password'}" placeholder="${m==='signup'?'8 caractères minimum':''}">`:''}
    ${s.err?`<p class="err" style="margin-top:10px">${esc(s.err)}</p>`:''}
    ${s.unconfirmed?resendBtn:''}
    <button class="btn primary block" style="margin-top:16px" data-act="authgo" ${s.busy?'disabled':''}>${s.busy?'Un instant…':{login:'Se connecter',signup:'Créer mon compte',reset:'Envoyer le lien'}[m]}</button>
    <div class="authlinks">${m==='login'?`<button class="link" data-act="authmode" data-m="reset">Mot de passe oublié ?</button><button class="link" data-act="authmode" data-m="signup">Créer un compte</button>`:`<button class="link" data-act="authmode" data-m="login">J’ai déjà un compte</button>`}</div>`;
  return {title,body};
}
async function authGo(){
  const s=V.sheet;if(!s||!SYNC.sb)return;
  const em=($('#aem')||{}).value||'',pw=($('#apw')||{}).value||'';s.email=em.trim();s.unconfirmed=false;
  if(!/^\S+@\S+\.\S+$/.test(s.email)){s.err='Adresse e-mail invalide.';renderSheet();return;}
  if(s.mode!=='reset'&&pw.length<(s.mode==='signup'?8:1)){s.err=s.mode==='signup'?'Mot de passe trop court : au moins 8 caractères.':'Entre ton mot de passe.';renderSheet();return;}
  s.busy=true;s.err='';renderSheet();
  const redirect=location.origin+location.pathname;
  try{
    if(s.mode==='signup'){
      const {data,error}=await SYNC.sb.auth.signUp({email:s.email,password:pw,options:{emailRedirectTo:redirect}});
      if(error)throw error;
      if(data.session){SYNC.user=data.user;closeSheet();await afterLogin(true);}
      else{s.done='Compte créé ! Clique sur le lien envoyé à <b>'+esc(s.email)+'</b> pour le confirmer, puis connecte-toi.';s.resendAt=Date.now();startResendTick(s);}
    }else if(s.mode==='reset'){
      const {error}=await SYNC.sb.auth.resetPasswordForEmail(s.email,{redirectTo:redirect});
      if(error)throw error;s.done='E-mail envoyé à <b>'+esc(s.email)+'</b> : ouvre le lien pour choisir un nouveau mot de passe.';
    }else{
      const {data,error}=await SYNC.sb.auth.signInWithPassword({email:s.email,password:pw});
      if(error)throw error;SYNC.user=data.user;closeSheet();await afterLogin(true);
    }
  }catch(e){s.err=friendlyErr(e);if(/Email not confirmed/i.test(String(e&&(e.message||e.msg)||''))) s.unconfirmed=true;}
  if(V.sheet===s){s.busy=false;renderSheet();}
}
async function resendConfirm(){
  const s=V.sheet;if(!s||!SYNC.sb||!s.email)return;
  s.resendBusy=true;renderSheet();
  const redirect=location.origin+location.pathname;
  try{
    const {error}=await SYNC.sb.auth.resend({type:'signup',email:s.email,options:{emailRedirectTo:redirect}});
    if(error)throw error;
    s.resendAt=Date.now();startResendTick(s);toast('Mail renvoyé à '+s.email);
  }catch(e){toast(friendlyErr(e));}
  if(V.sheet===s){s.resendBusy=false;renderSheet();}
}

function pdb(){
  return new Promise((res,rej)=>{
    if(PDB)return res(PDB);
    if(typeof indexedDB==='undefined')return rej(new Error('no-idb'));
    const rq=indexedDB.open('forma-body',1);
    rq.onupgradeneeded=()=>{rq.result.createObjectStore('entries',{keyPath:'id'});};
    rq.onsuccess=()=>{PDB=rq.result;res(PDB);};
    rq.onerror=()=>rej(rq.error);
  });
}

function resizeImage(file,maxW){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const scale=Math.min(1,maxW/img.width),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        const ctx=cv.getContext('2d');ctx.drawImage(img,0,0,w,h);
        try{res(cv.toDataURL('image/jpeg',0.82));}catch(e){rej(e);}
      };
      img.onerror=()=>rej(new Error('img'));
      img.src=fr.result;
    };
    fr.onerror=()=>rej(fr.error||new Error('read'));
    fr.readAsDataURL(file);
  });
}

    if(last3<=before){st++;out.push(Object.assign({tone:'warn',title:'Stagnation : '+ex.n,text:'Aucun record sur les 3 dernières séances. Essaie une semaine allégée (−15 %), une autre plage de répétitions ou une variante.'},deloadActive()?{tab:'progress'}:{act:{act:'startdeload',label:'Générer ma semaine allégée'}}));}
  });
  const sl=weightSlope();
  if(sl!==null){
    const s3=(sl>0?'+':'')+nf(sl)+' kg/semaine';
    if(g==='gain'&&sl<0.1)out.push({tone:'warn',title:'Le poids ne monte pas',text:'Tendance : '+s3+'. Ta cible de base a été relevée de 150 kcal.',tab:'progress'});

  }

}

function ring(pct,size,sw){

const mico=(m)=>`<span class="mico" style="--c:${mcol(m)}">${icon('dumbbell',20)}</span>`;
function lineChart(pts,unit){
  if(!pts.length)return '';
  const W=320,H=170,pl=36,pr=14,pt=18,pb=24,id='ar'+(++gid);
  const ys=pts.map(p=>p.y);let mn=Math.min(...ys),mx=Math.max(...ys);
  if(mn===mx){mn-=1;mx+=1;}
  const ext=(mx-mn)*0.2;mn-=ext;mx+=ext;
  const t=pts.map(p=>parse(p.x).getTime()),t0=Math.min(...t),t1=Math.max(...t);
  const X=i=>pts.length===1?pl+(W-pl-pr)/2:pl+(t[i]-t0)/((t1-t0)||1)*(W-pl-pr);
  const Y=v=>pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution en ${unit}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>`;
  [mn+ext,(mn+mx)/2,mx-ext].forEach(v=>{s+=`<line class="g" x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${pl-6}" y="${Y(v)+3}" text-anchor="end">${nf(v)}</text>`;});
  const d=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  if(pts.length>1)s+=`<path d="${d} L${X(pts.length-1).toFixed(1)} ${H-pb} L${X(0).toFixed(1)} ${H-pb} Z" fill="url(#${id})"/>`;
  s+=`<path class="l" d="${d}"/>`;
  pts.forEach((p,i)=>{const last=i===pts.length-1;if(last||pts.length<=14)s+=`<circle class="${last?'dl':'d'}" cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${last?5.5:3.5}"/>`;});
  const lp=pts[pts.length-1];
  s+=`<text class="val" x="${Math.min(X(pts.length-1),W-pr-4)}" y="${Y(lp.y)-11}" text-anchor="end">${nf(lp.y)} ${unit}</text>`;
  const sd=o=>fmt(o,{day:'numeric',month:'short'});
  s+=`<text x="${pl}" y="${H-6}">${sd(pts[0].x)}</text>`;
  if(pts.length>1)s+=`<text x="${W-pr}" y="${H-6}" text-anchor="end">${sd(lp.x)}</text>`;
  return s+'</svg>';
}

const GLASS=250;
const glassSVG=`<svg viewBox="0 0 28 34" width="28" height="34" aria-hidden="true"><path class="gw" d="M6.3 11H21.7L19.6 30.2Q19.4 31.3 18.3 31.3H9.7Q8.6 31.3 8.4 30.2Z"/><path class="gs" d="M4 3H24L21.5 30.6Q21.2 33 18.8 33H9.2Q6.8 33 6.5 30.6Z"/></svg>`;
function hydroCard(d){
  const wsum=mealsOn(d).filter(m=>m.name==='Eau').reduce((a,m)=>a+(m.g||0),0);
  const target=Math.max(1000,Math.round(weightNow()*35/100)*100),goal=Math.ceil(target/GLASS),n=Math.round(wsum/GLASS);
  const tot=Math.max(goal,n);
  const glasses=Array.from({length:tot},(_,i)=>`<button class="glass${i<n?' on':''}${i>=goal?' extra':''}" data-act="setglass" data-i="${i}" aria-label="${i<n?(i===n-1?'Retirer ce verre':'Revenir à '+(i+1)+' verre'+(i?'s':'')):'Boire jusqu’à '+(i+1)+' verre'+(i?'s':'')}">${glassSVG}</button>`).join('');
  return `<div class="card hydro">
    <div class="hyh"><span class="sic">${icon('water',22)}</span><div><h3>Hydratation</h3><small>${n} / ${goal} verre${goal>1?'s':''} · ${nf(n*GLASS/1000)} L sur ${nf(target/1000)} L</small></div></div>

      <button class="chip" data-act="setglass" data-i="${n}">${icon('plus',14)} 1 verre</button>

    </div>
    ${n>=goal&&goal>0?`<p class="sub" style="margin-top:6px">Objectif atteint, bien hydraté !</p>`:''}
  </div>`;
}
function setGlasses(k){
  const d=V.mdate,list=S.meals.filter(m=>m.date===d&&m.name==='Eau');
  const cur=list.reduce((a,m)=>a+(m.g||0),0);let diff=Math.max(0,k)*GLASS-cur;
  if(diff>0){for(let i=0;i<diff/GLASS;i++)S.meals.push({id:uid(),date:d,slot:'Eau',name:'Eau',g:GLASS,kcal:0,p:0,c:0,f:0,fi:0});}
  else{
    for(let i=list.length-1;i>=0&&diff<0;i--){const m=list[i];if(m.g<=-diff){diff+=m.g;S.meals=S.meals.filter(x=>x.id!==m.id);}else{m.g+=diff;diff=0;}}
  }
}

function badgeDefs(){
  const ws=S.workouts.filter(w=>w.entries.some(e=>e.sets.length));
  const totalTon=ws.reduce((a,w)=>a+tonnage(w),0);
  let prCount=0;const byEx={};
  ws.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(w=>w.entries.forEach(en=>{

    const top=e1(topSet(en.sets)),pb=byEx[en.exId]||0;

function checkNewBadges(){
  const earned=badgeDefs().filter(b=>b.earned).map(b=>b.id);
  if(!S.badgesSeen){S.badgesSeen=earned;save();return;}
  const fresh=earned.filter(id=>!S.badgesSeen.includes(id));
  if(fresh.length){
    const byId={};badgeDefs().forEach(b=>byId[b.id]=b);
    S.badgesSeen=[...S.badgesSeen,...fresh];

    save();
    fresh.forEach((id,i)=>setTimeout(()=>toastReward('🏆 Badge débloqué : '+byId[id].title),i*1700));
  }

async function syncProfile(){
  if(!SYNC.user||!SYNC.sb)return;
  try{
    await SYNC.sb.from('profiles').upsert({
      id:SYNC.user.id,display_name:S.profile.name||'',
      avatar:(AVATARS[S.profile.avatar||'letter']||{}).glyph||'',
      status_emoji:(STATUSES[S.profile.statusEmoji||'st_none']||{}).glyph||null,
      frame:S.profile.frame||'fr_none',
      day_streak:dayStreak(),coins:coinsBalance(),updated_at:new Date().toISOString()
    });
  }catch(e){}
}
async function loadFriends(){
  if(!SYNC.user){V.friends={loading:false,list:[],pending:[],outgoing:[],err:'Connecte-toi pour ajouter des amis.'};render(true);return;}
  V.friends={loading:true,list:[],pending:[],outgoing:[],err:''};render(true);
  try{
    await syncProfile();
    const uid=SYNC.user.id;
    const {data:meRow}=await SYNC.sb.from('profiles').select('username').eq('id',uid).maybeSingle();
    const {data:rows,error}=await SYNC.sb.from('friendships').select('*').or(`user_id.eq.${uid},friend_id.eq.${uid}`);
    if(error)throw error;
    const accepted=(rows||[]).filter(r=>r.status==='accepted');
    const pendingIncoming=(rows||[]).filter(r=>r.status==='pending'&&r.friend_id===uid);
    const pendingOutgoing=(rows||[]).filter(r=>r.status==='pending'&&r.user_id===uid);
    const friendIds=accepted.map(r=>r.user_id===uid?r.friend_id:r.user_id);
    let profiles=[];
    if(friendIds.length){const {data:profs}=await SYNC.sb.from('profiles').select('*').in('id',friendIds);profiles=(profs||[]).map(p=>{const r=accepted.find(r=>r.user_id===p.id||r.friend_id===p.id);return Object.assign({},p,{friendshipId:r&&r.id});});}
    const pendingProfIds=pendingIncoming.map(r=>r.user_id);
    let pendingProfiles=[];
    if(pendingProfIds.length){const {data:pprofs}=await SYNC.sb.from('profiles').select('*').in('id',pendingProfIds);pendingProfiles=pprofs||[];}
    const outgoingProfIds=pendingOutgoing.map(r=>r.friend_id);
    let outgoingProfiles=[];
    if(outgoingProfIds.length){const {data:oprofs}=await SYNC.sb.from('profiles').select('*').in('id',outgoingProfIds);outgoingProfiles=oprofs||[];}
    const {data:topGlobal}=await SYNC.sb.from('profiles').select('*').order('day_streak',{ascending:false}).order('coins',{ascending:false}).limit(20);
    V.friends={loading:false,me:(meRow&&meRow.username)||'',list:profiles,global:topGlobal||[],
      pending:pendingIncoming.map(r=>({id:r.id,profile:pendingProfiles.find(p=>p.id===r.user_id)})),
      outgoing:pendingOutgoing.map(r=>({id:r.id,profile:outgoingProfiles.find(p=>p.id===r.friend_id)})),err:''};
  }catch(e){V.friends={loading:false,list:[],pending:[],outgoing:[],err:'Impossible de charger tes amis pour le moment.'};}
  render(true);
}

function exUsage(){const m={};S.workouts.forEach(w=>w.entries.forEach(e=>{if(e.sets.length)m[e.exId]=(m[e.exId]||0)+1;}));return m;}
function exList(q,m){const u=exUsage();return allEx().filter(e=>(!m||m==='Tous'||e.m===m)&&(!q||norm(e.n).includes(norm(q)))&&(u[e.id]||equipOK(e))).sort((a,b)=>(u[b.id]||0)-(u[a.id]||0));}
function exRows(list){
  const w=getWorkout(V.date),inW=id=>w&&w.entries.some(e=>e.exId===id);
  return list.length?list.map(e=>`<button class="lrow" data-act="pickex" data-id="${e.id}" ${inW(e.id)?'disabled':''}>${mico(e.m)}<span class="ln"><b>${esc(e.n)}</b><small>${e.m}</small></span>${inW(e.id)?icon('check',18):icon('plus',18)}</button>`).join(''):`<p class="empty">Aucun exercice trouvé.</p>`;
}
function foodUsage(){const c={};S.meals.forEach(m=>{c[m.name]=(c[m.name]||0)+1;});return c;}
const foodCats=()=>['Tous'].concat(Object.values(FCAT),(S.customFoods||[]).length?['Mes aliments']:[],FOODS.some(f=>f._off)?['Marques (en ligne)']:[]);
function foodList(q,cat){
  const words=norm(q||'').split(/\s+/).filter(Boolean),use=foodUsage();
  const l=FOODS.map((f,i)=>({f,i})).filter(x=>dietOK(x.f.n)&&(!cat||cat==='Tous'||x.f.cat===cat)&&words.every(w=>x.f._n.includes(w)));
  l.sort((a,b)=>{
    const sa=words.length&&a.f._n.startsWith(words[0])?1:0,sb=words.length&&b.f._n.startsWith(words[0])?1:0;
    return (sb-sa)||((use[b.f.n]||0)-(use[a.f.n]||0))||(a.i-b.i);
  });
  return l;
}
function foodRows(q,cat){
  const l=foodList(q,cat),max=60;
  if(!l.length)return `<p class="empty">Aucun aliment trouvé. Utilise la saisie manuelle pour l’ajouter.</p>`;
  return l.slice(0,max).map(x=>`<button class="lrow" data-act="pickfood" data-i="${x.i}"><span class="sic" style="width:38px;height:38px">${icon('apple',18)}</span><span class="ln"><b>${esc(x.f.n)}</b><small>${r0(x.f.k)} kcal · P ${nf(x.f.p)} · G ${nf(x.f.c)} · L ${nf(x.f.f)} · 100 g${x.f._off?' · en ligne':''}</small></span>${icon('plus',18)}</button>`).join('')
    +(l.length>max?`<p class="sub" style="text-align:center;padding:10px">${l.length-max} autres résultats : précise ta recherche.</p>`:'');
}

function celebrationHTML(){
  const c=S.profile.celebration||'classic';
  if(c==='classic')return '';
  const rnd=(a,b)=>a+Math.random()*(b-a);
  if(c==='confetti'){
    const colors=['var(--accent)','var(--prot)','var(--gold)','var(--good)','var(--fat)'];
    const bits=Array.from({length:26},()=>`<i style="left:${rnd(0,100)}%;background:${colors[Math.floor(Math.random()*colors.length)]};animation-delay:${rnd(0,.4)}s;animation-duration:${rnd(1.4,2.2)}s;transform:rotate(${rnd(0,360)}deg)"></i>`).join('');
    return `<div class="confetti-burst">${bits}</div>`;
  }
  if(c==='fireworks'){
    const colors=['var(--accent)','var(--gold)','var(--prot)','#fff'];
    const dots=Array.from({length:20},()=>{const ang=rnd(0,360),dist=rnd(60,130);return `<i style="--ang:${ang}deg;--dist:${dist}px;background:${colors[Math.floor(Math.random()*colors.length)]};animation-delay:${rnd(0,.3)}s"></i>`;}).join('');
    return `<div class="fw-burst"><div class="fw-center">${dots}</div></div>`;
  }
  if(c==='sparkle'){
    const stars=Array.from({length:14},()=>`<i style="left:${rnd(4,96)}%;top:${rnd(4,60)}%;animation-delay:${rnd(0,1)}s">${icon('spark',14)}</i>`).join('');
    return `<div class="sparkle-burst">${stars}</div>`;
  }
  return '';
}

/* ================= Animations & interactions ================= */
const FX={
  calm:()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches,
  key:null,chatN:0,
  after(){
    const onb=!!V.ob,k=onb?'ob'+V.ob.page:V.tab,changed=k!==FX.key,main=$('#main'),nav=$('#nav');FX.key=k;
    if(changed&&!FX.calm()){
      [main,nav].forEach(e=>{e.classList.remove('enter');void e.offsetWidth;e.classList.add('enter');});
      clearTimeout(FX.te);FX.te=setTimeout(()=>{main.classList.remove('enter');nav.classList.remove('enter');},1300);
      FX.countUp();
    }
    /* nouvelles bulles du chat */
    const bubs=document.querySelectorAll('.bub:not(#cbot)');
    if(bubs.length>FX.chatN&&!changed)for(let i=FX.chatN;i<bubs.length;i++)bubs[i].classList.add('fresh');
    FX.chatN=bubs.length;
    const cb=$('#cbot');if(cb&&!cb.dataset.seen){cb.dataset.seen=1;cb.classList.add('fresh');}
    const f=V.fx;V.fx=null;if(!f||FX.calm())return;
    if(f.set){
      const rows=[...document.querySelectorAll(`[data-act="delset"][data-ex="${f.set}"]`)].map(b=>b.closest('.set'));
      const row=rows[rows.length-1];if(row)row.classList.add('fresh');
      const ok=document.querySelector(`.okbtn[data-ex="${f.set}"]`);if(ok)ok.classList.add('done');
      if(f.pr){const tag=row&&row.querySelector('.prtag')||document.querySelector('.prtag');if(tag){tag.classList.add('fresh');setTimeout(()=>FX.burst(tag),120);}}
    }
    if(f.glass!==undefined){document.querySelectorAll('.glass.on').forEach((g,i)=>{if(i>=f.glass){g.classList.add('fill');g.style.animationDelay=((i-f.glass)*70)+'ms';g.querySelector('.gw').style.animationDelay=((i-f.glass)*70)+'ms';}});}
    if(f.water!==undefined){const i=document.querySelector('.hybar i');if(i&&i.animate)i.animate([{width:f.water},{width:i.style.width}],{duration:600,easing:'cubic-bezier(.25,.8,.25,1)'});}
    if(f.meal){const it=document.querySelectorAll('.card.slot .item');it.forEach(x=>{if(x.querySelector(`[data-id="${f.meal}"]`))x.classList.add('fresh');});}
  },
  /* chiffres qui défilent à l'arrivée sur l'onglet */
  countUp(){
    document.querySelectorAll('.ringc .num,.bigk,.tile .tv,.rctiles b').forEach(el=>{
      const n=el.firstChild;if(!n||n.nodeType!==3)return;
      const txt=n.nodeValue,m=txt.match(/^([\d\s\u202f\u00a0]+)$/);if(!m)return;
      const to=parseInt(txt.replace(/\D/g,''),10);if(!(to>9))return;
      const t0=performance.now(),d=Math.min(900,350+to/10);
      const step=t=>{const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);n.nodeValue=fmtN(to*e);if(p<1&&n.isConnected)requestAnimationFrame(step);else n.nodeValue=txt;};
      n.nodeValue=fmtN(0);requestAnimationFrame(step);
    });
  },
  /* petite explosion de confettis dorés */
  burst(el){
    const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    const cols=['#F5B400','#FF7A2F','#FF3D6E','#FFD66B','#3B7BF6'];
    for(let i=0;i<18;i++){
      const b=document.createElement('i');b.className='fx-bit';b.style.background=cols[i%cols.length];b.style.left=cx+'px';b.style.top=cy+'px';
      if(i%3===0)b.style.borderRadius='50%';
      document.body.appendChild(b);
      const a=Math.random()*Math.PI*2,v=40+Math.random()*70,dx=Math.cos(a)*v,dy=Math.sin(a)*v-40;
      b.animate([{transform:'translate(-50%,-50%) scale(1) rotate(0)',opacity:1},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy+60}px)) scale(.6) rotate(${Math.random()*540}deg)`,opacity:0}],{duration:700+Math.random()*400,easing:'cubic-bezier(.2,.7,.4,1)'}).onfinish=()=>b.remove();
    }
  },
  /* onde au toucher sur les boutons principaux */
  ripple(e){
    const t=e.target.closest('.btn.primary,.okbtn,.addb,.fab,.herocard .btn');if(!t||FX.calm())return;
    const r=t.getBoundingClientRect(),s=Math.max(r.width,r.height)*2,sp=document.createElement('span');
    sp.className='fx-ripple';sp.style.width=sp.style.height=s+'px';sp.style.left=(e.clientX-r.left-s/2)+'px';sp.style.top=(e.clientY-r.top-s/2)+'px';
    if(getComputedStyle(t).position==='static')t.style.position='relative';t.style.overflow='hidden';
    t.appendChild(sp);sp.animate([{transform:'scale(0)',opacity:.3},{transform:'scale(1)',opacity:0}],{duration:550,easing:'ease-out'}).onfinish=()=>sp.remove();
  }
};

  const sched=[[0,'push'],[2,'pull'],[4,'legs'],[5,'push']];

      });

    });

    const date=addDays(td,-i);
    day.forEach((sl,si)=>{
      if(i===0&&si>1)return;
      sl[1].forEach(it=>{const f=FOODS.find(x=>x.n===it[0]),g=Math.round(it[1]*(0.92+rnd()*0.16)),k=g/100;
        D.meals.push({id:uid(),date,slot:sl[0],name:f.n,g,kcal:f.k*k,p:f.p*k,c:f.c*k,f:f.f*k});});
    });
  }
  for(let i=36;i>=0;i-=3)D.bodyweights.push({date:addDays(td,-i),kg:Math.round((74.8+(36-i)/36*1.3+(rnd()-.5)*.4)*10)/10});
  return D;
}

function figJoints(P,t){
  const q={t:lp(P.A.t,P.B.t,t),r:lp(P.A.r||(P.A.l&&P.A.l.r)||0,P.B.r||0,t)};
  if(P.A.r!==undefined)q.r=lp(P.A.r,P.B.r,t);
  const rel=!!P.A.ra;
  q.a=lpa(P.A.ra||P.A.a,P.B.ra||P.B.a,t);
  if(rel){const d=q.t-180;q.a=q.a.map(x=>x+d);}
  q.l=lpa(P.A.l,P.B.l,t);
  q.l2=P.A.l2?lpa(P.A.l2,P.B.l2,t):null;
  const S=svv(q.t,FG.LT),E=vadd(S,svv(q.a[0],FG.LU)),H=vadd(E,svv(q.a[1],FG.LF));
  const K=svv(q.l[0],FG.LH),An=vadd(K,svv(q.l[1],FG.LS));
  let K2=null,A2=null;
  if(q.l2){K2=svv(q.l2[0],FG.LH);A2=vadd(K2,svv(q.l2[1],FG.LS));}
  const Hd=vadd(S,svv(q.t,17));
  let d=[0,0],floor=FLOOR;
  if(P.fix==='feet')d=[(P.x||110)-An[0],(FLOOR-(q.r||0))-An[1]];
  else if(P.fix==='hip'){d=[P.hip[0],P.hip[1]];floor=P.floorY||(Math.max(An[1],A2?A2[1]:-999)+P.hip[1]+4);}
  else if(P.fix==='hands')d=[P.hand[0]-H[0],P.hand[1]-H[1]];
  else if(P.fix==='floorhip'){d=[P.hip[0],FLOOR-Math.max(An[1],0)];}
  const T=p=>p?vtr(p,d):null;
  return {q,hip:T([0,0]),S:T(S),E:T(E),H:T(H),K:T(K),An:T(An),K2:T(K2),A2:T(A2),Hd:T(Hd),floor,d};
}

function figFrame(ts){

/* ================= Poids conseillés ================= */
/* 1RM estimé en fraction du poids de corps (niveau intermédiaire, homme) ; 0 = poids du corps */
const RATIO={dc:1.0,di:.32,presh:.35,ecarte:.2,dips:0,pompes:0,pdec:0,tract:0,rowb:.85,tirage:.9,rowh:.4,rowinv:0,dm:.65,lat:.15,oiseau:.1,pike:0,curl:.5,curlm:.2,curlh:.2,chin:0,ext:.5,front:.5,extdh:.25,pdia:0,squat:1.3,presse:2.2,fentes:.6,goblet:.4,squatb:0,bulg:0,sdt:1.3,rdlh:.4,legc:.6,hip:1.6,hipb:0,moll:1.5,mollb:0,crunch:0};
const DBELL=['di','presh','rowh','lat','oiseau','curlm','curlh','extdh','rdlh'];
const TIMED=['gainage'];
const floorTo=(x,st)=>Math.floor(x/st+1e-9)*st;
function e1Best(id,d){const s=sessionsOf(id).filter(x=>x.date<d).slice(-2);return s.length?Math.max(...s.map(x=>e1(topSet(x.sets)))):0;}
function feelAdj(id,d){
  const s=lastSession(id,d);if(!s)return 1;
  const f=s.sets.map(x=>x.f).filter(x=>x!==undefined);
  if(!f.length)return 1;
  if(f.some(x=>x===1))return .975;
  if(f.every(x=>x===-1))return 1.03;
  return 1;
}
function estE1(id){
  const r=RATIO[id];if(!(r>0))return 0;
  const lv={beginner:.6,mid:1,adv:1.3}[S.profile.level]||1,sx=S.profile.sex==='f'?.7:1;
  return r*weightNow()*lv*sx;
}
function repsTarget(id){
  const comp=COMPOUND.includes(id),prudent=S.profile.level==='beginner'||S.profile.goal==='cut';
  return comp?(prudent?10:8):12;
}
/* Poids conseillé pour "reps" répétitions, en gardant environ 1 répétition en réserve :
   volontairement un peu sous ton maximum pour que tu finisses toute la série. */
function recWeight(id,reps,d){
  if(RATIO[id]===0)return {kg:0,src:'bw'};
  let e=e1Best(id,d),src='history';
  if(e>0)e*=feelAdj(id,d);
  else{e=estE1(id);src='estimate';if(!(e>0))return null;e*=0.85;}
  const raw=e/(1+(reps+1)/30);
  const st=DBELL.includes(id)?(raw>=14?2:1):(raw>=20?2.5:1);
  return {kg:Math.max(st,floorTo(raw,st)),src,max:Math.round(e/(1+reps/30))};
}
/* progression d'une séance à l'autre, à partir de la dernière fois */
function progKg(id,d,reps){
  const last=lastSession(id,d);if(!last)return null;
  const work=last.sets.filter(x=>x.kg>0);if(!work.length)return null;
  const top=Math.max(...work.map(x=>x.kg)),atTop=work.filter(x=>x.kg===top);
  const st=DBELL.includes(id)?(top>=14?2:1):(top>=20?2.5:1);
  const hard=last.sets.some(x=>x.f===1),easy=last.sets.every(x=>x.f===-1);
  const allHit=atTop.every(x=>x.reps>=reps),miss=atTop.filter(x=>x.reps<reps-2).length>atTop.length/2;
  let kg=top,why;
  if(allHit&&!hard){kg=top+(easy?2*st:st);why=`+${nf(kg-top)} kg : toutes tes répétitions réussies à ${nf(top)} kg la dernière fois.`;}
  else if(miss){kg=Math.max(st,top-st);why=`−${nf(st)} kg : plusieurs séries sous ${reps} répétitions la dernière fois.`;}
  else why=`Même charge : vise ${reps} répétitions sur toutes les séries avant d’augmenter.`;
  const gap=daysBetween(last.date,d);
  if(gap>=21){kg*=0.85;why=`Reprise après ${gap} jours sans cet exercice : −15 %.`;}
  else if(gap>=10){kg*=0.93;why=`Reprise après ${gap} jours : charge un peu réduite.`;}
  return {kg:Math.max(st,floorTo(kg+1e-9,st)),why};
}
const deloadActive=()=>!!(S.deloadUntil&&today()<=S.deloadUntil);
function planFor(id,d){
  const dl=!!(S.deloadUntil&&d&&d<=S.deloadUntil);
  const last=lastSession(id,d),n0=last?Math.max(2,Math.min(6,last.sets.length)):defSets();
  const n=dl?Math.max(2,n0-1):n0;
  if(TIMED.includes(id)){
    const reps=last?Math.min(180,topSet(last.sets).reps+5):30;
    return {n,kg:0,reps,src:'time',why:last?'+5 s par rapport à la dernière fois.':'',on:today()};
  }
  if(RATIO[id]===0){
    const reps=last?Math.min(30,topSet(last.sets).reps+1):(parseInt(defReps(),10)||8);
    return {n,kg:0,reps,src:'bw',why:last?'Une répétition de plus que la dernière fois.':'',on:today()};
  }
  const reps=repsTarget(id),rec=recWeight(id,reps,d);
  if(!rec)return null;
  let kg=rec.kg,why=rec.src==='estimate'?'Première fois : charge estimée, ajuste au ressenti.':'';
  const pg=rec.src==='history'?progKg(id,d,reps):null;
  if(pg){kg=pg.kg;why=pg.why;rec.max=Math.max(rec.max||0,kg);}
  if(dl){const st=DBELL.includes(id)?(kg>=14?2:1):(kg>=20?2.5:1);kg=Math.max(st,floorTo(kg*0.85,st));}
  return {n,kg,reps,src:rec.src,max:rec.max,deload:dl,why:dl?'Semaine allégée : −15 %.':why,on:today()};
}
/* ressenti après une série : ajuste le poids de la série suivante */
function applyFb(v){
  const P=V.play,ls=P&&P.lastSet;if(!ls)return;
  ls.fb=v;ls.ref.f=v;
  const nx=pickNext();
  if(nx&&nx.e.exId===ls.ex){
    if(P.fbBase===0)P.cur.reps=Math.max(1,P.fbBaseReps+(v===-1?1:v===1?-1:0));
    else{const st=P.fbBase>=20?2.5:1;P.cur.kg=Math.max(0,Math.round((P.fbBase+(v===-1?st:v===1?-st:0))*100)/100);P.cur.rec=P.cur.kg;}
  }
  save();
}

/* ================= Repas : génération selon l'heure ================= */
const SHARE={'Petit-déjeuner':.25,'Déjeuner':.35,'Collation':.10,'Dîner':.30};
const shareOf=s=>{const sn=S.profile.snacks;if(s==='Collation')return sn?.10:.10;return SHARE[s]/(sn?1:.9);};
const sumM=a=>a.reduce((t,m)=>({kcal:t.kcal+m.kcal,p:t.p+m.p,c:t.c+m.c,f:t.f+m.f}),{kcal:0,p:0,c:0,f:0});
function slotBudget(slot,d){
  const t=T(d),tot=totalsOn(d),sh=shareOf(slot),eaten=sumM(mealsOn(d).filter(m=>m.slot===slot));
  const goal={kcal:t.kcal*sh,p:t.p*sh,c:t.c*sh,f:t.f*sh};
  const left={kcal:Math.max(0,t.kcal-tot.kcal),p:Math.max(0,t.p-tot.p),c:Math.max(0,t.c-tot.c),f:Math.max(0,t.f-tot.f)};
  const b={};
  ['kcal','p','c','f'].forEach(k=>{b[k]=Math.max(0,goal[k]-eaten[k]);});
  if(b.kcal<80)['kcal','p','c','f'].forEach(k=>{b[k]=left[k]*sh;});
  ['kcal','p','c','f'].forEach(k=>{b[k]=Math.min(b[k],left[k]);});
  return {goal,eaten,b};
}
const visibleSlots=d=>SLOTS.filter(s=>slotVisible(s,d));
function currentSlot(d){
  const order=visibleSlots(d);let i=order.indexOf(slotNow());if(i<0)i=0;
  const eaten=sumM(mealsOn(d).filter(m=>m.slot===order[i])).kcal;
  if(eaten>=0.8*T(d).kcal*shareOf(order[i])&&i<order.length-1)i++;
  return order[i];
}

const MAXG={'Whey (poudre)':40,'Protéine végétale (poudre)':40,'Huile d’olive':20,'Amandes':40,'Beurre de cacahuète':30,'Avocat':100,'Houmous':80,'Œuf entier':240,'Flocons d’avoine':120,'Pain complet':120,'Banane':200,'Pomme':200,'Seitan':150,'Brocoli cuit':250,'Boisson au soja':300,'Skyr':350,'Yaourt grec':300,'Fromage blanc 0 %':350,'Yaourt grec 0 %':300,'Cottage cheese':250,'Raisins secs':40,'Datte Medjool':72,'Galette de riz':40,'Muesli (sans sucre ajouté)':100,'Kiwi':150,'Poire':200,'Noix':40,'Noix de cajou':40,'Tempeh':200,'Steak végétal (soja)':200,'Gnocchis cuits':350,'Pain complet':120};
const shortN=n=>n.replace(/ \(.*?\)/,'').replace(/ (cuit|cuite|cru|crue|grillé|grillée|poêlé|poêlée|rôti|rôtie)s?$/,'').replace(/ 5 %$/,'').replace(/^Blanc de /,'').replace(/^Œuf entier$/,'Œufs');
const capN=s=>s.charAt(0).toUpperCase()+s.slice(1);
function genLocal(slot,b,wish){
  if(b.kcal>=120)b={kcal:b.kcal,p:Math.max(b.p,b.kcal*0.2/4),c:b.c,f:b.f};
  if(b.kcal<120)return {opts:[],empty:'Tu as déjà atteint ta cible pour ce repas. Garde une petite collation protéinée (skyr, whey) si tu as encore faim.'};
  const F=n=>FMAP[n],mk=(n,g)=>{const f=F(n),k=g/100;return {name:n,g,kcal:f.k*k,p:f.p*k,c:f.c*k,f:f.f*k};};
  const wn=norm(wish||''),words=wn.split(/[^a-z0-9]+/).filter(w=>w.length>3);
  const tagFoods=Object.keys(WISH_TAGS).filter(tag=>wn.includes(norm(tag))).flatMap(tag=>WISH_TAGS[tag]);
  const wishF=(words.length||tagFoods.length)?[...new Set([
    ...FOODS.filter(f=>dietOK(f.n)&&words.some(w=>norm(f.n).includes(w))).map(f=>f.n),
    ...tagFoods.filter(n=>F(n)&&dietOK(n))
  ])]:[];
  const shuf=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
  const ord=l=>{const ok=l.filter(n=>F(n)&&dietOK(n)),w=ok.filter(n=>wishF.includes(n)),rest=ok.filter(n=>!w.includes(n));return [...shuf(w),...shuf(rest)];};
  const clampG=(n,g,st)=>Math.max(st,Math.min(MAXG[n]||400,Math.round(g/st)*st));
  const bf=slot==='Petit-déjeuner',main=slot==='Déjeuner'||slot==='Dîner';
  const P=ord(main?POOL.mainP:bf?POOL.bfP:POOL.snP),C=ord(main?POOL.mainC:bf?POOL.bfC:POOL.snC);
  const Vg=ord(POOL.veg),Fa=ord(main?POOL.fat:POOL.snF),Fr=ord(['Banane','Pomme']);
  if(!P.length)return {opts:[],empty:'Aucun aliment compatible avec ton alimentation. Utilise la saisie manuelle.'};
  const opts=[],seen={};
  for(let i=0;i<12&&opts.length<5;i++){
    const pn=P[i%P.length],cn=C.length?C[i%C.length]:null,items=[];
    items.push(mk(pn,clampG(pn,b.p*0.7/(F(pn).p/100),10)));
    if(main&&Vg.length)items.push(mk(Vg[i%Vg.length],b.kcal>500?150:100));
    if(bf&&cn&&!Fr.includes(cn)&&Fr.length)items.push(mk(Fr[0],100));
    if(cn){const cur=sumM(items);items.push(mk(cn,clampG(cn,Math.max(0,b.c-cur.c)/(F(cn).c/100),10)));}
    const fn=Fa.length?Fa[i%Fa.length]:null;
    if(fn){const rf=b.f-sumM(items).f;if(rf>3)items.push(mk(fn,clampG(fn,rf/(F(fn).f/100),5)));}
    if(cn)for(let k=0;k<3;k++){
      const diff=b.kcal-sumM(items).kcal;if(Math.abs(diff)<b.kcal*0.08)break;
      const ci=items.find(x=>x.name===cn);Object.assign(ci,mk(cn,clampG(cn,ci.g+diff/(F(cn).k/100),10)));
    }
    {const diff=b.kcal-sumM(items).kcal,c2=C.find(n=>n!==cn&&!items.some(x=>x.name===n));
      if(diff>b.kcal*0.15&&c2)items.push(mk(c2,clampG(c2,diff/(F(c2).k/100),10)));}
    const key=items.map(x=>x.name+x.g).join('|');if(seen[key])continue;seen[key]=1;
    const t=sumM(items),fats=POOL.fat.concat(POOL.snF);
    const order=[pn].concat(cn?[cn]:[]).concat(items.map(x=>x.name).filter(n=>n!==pn&&n!==cn&&!fats.includes(n)));
    const names=order.slice(0,3).map((n,j)=>j?shortN(n).toLowerCase():capN(shortN(n)));
    const title=names.length>1?names.slice(0,-1).join(', ')+' et '+names[names.length-1]:names[0];
    opts.push({name:title,detail:items.map(x=>capN(shortN(x.name))+' '+x.g+' g').join(' · '),items,kcal:t.kcal,p:t.p,c:t.c,f:t.f,src:'local'});
  }
  return {opts,empty:opts.length?'':'Impossible de composer un repas avec ces critères.'};
}

function normOpt(o){
  if(!o||!o.name||!Array.isArray(o.items))return null;
  const items=o.items.map(i=>({name:String((i&&i.name)||'').slice(0,60),g:num(i&&i.g),kcal:num(i&&i.kcal),p:num(i&&i.p)||0,c:num(i&&i.c)||0,f:num(i&&i.f)||0})).filter(i=>i.name&&!isNaN(i.kcal)&&i.kcal>=0&&i.kcal<3000).slice(0,8);
  if(!items.length)return null;
  const t=sumM(items);
  return {name:String(o.name).slice(0,60),detail:String(o.detail||'').slice(0,180),items,kcal:t.kcal,p:t.p,c:t.c,f:t.f,src:'ai'};
}

const TTS=typeof window!=='undefined'&&!!window.speechSynthesis&&typeof window.SpeechSynthesisUtterance==='function';
let VOICE=null;
function frVoices(){try{return window.speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang));}catch(e){return [];}}
function voiceScore(v){
  const n=(v.name||'').toLowerCase();let sc=0;
  if(/premium|enhanced|am[ée]lior/.test(n))sc+=50;
  if(/natural|neural|naturelle/.test(n))sc+=48;
  if(/siri/.test(n))sc+=40;
  if(/google/.test(n))sc+=30;
  if(/am[ée]lie|thomas|audrey|aur[ée]lie|marie|denise|henri|vivienne|remy|eloise/.test(n))sc+=12;
  if(v.localService===false)sc+=6;
  if(/fr[-_]fr/i.test(v.lang))sc+=5;
  if(/compact|espeak|robot/.test(n))sc-=40;
  if(/hortense|julie|paul\b/.test(n)&&!/natural|online/.test(n))sc-=10;
  return sc;
}
const voiceTag=v=>{const n=(v.name||'').toLowerCase();return /premium|enhanced|am[ée]lior|natural|neural|siri/.test(n)?'Haute qualité':(v.localService===false?'En ligne':'Standard');};
function pickVoice(){
  const vs=frVoices(),want=S&&S.profile&&S.profile.voiceName;
  VOICE=(want&&vs.find(v=>v.name===want))||vs.slice().sort((a,b)=>voiceScore(b)-voiceScore(a))[0]||null;
}

const voiceOn=()=>!!(V.play&&TTS&&(V.play.mode==='hands'||V.play.mode==='voice'));

  if(!TTS||!t)return;

const kgWords=k=>{const i=Math.floor(k+1e-9),f=Math.round((k-i)*100)/100;if(f===0)return i+(i>1?' kilos':' kilo');if(f===0.5)return i?i+' kilos et demi':'un demi-kilo';return nf(k).replace(',',' virgule ')+' kilos';};

function favOpts(slot,b){
  const main=x=>x==='Déjeuner'||x==='Dîner';
  return S.favs.filter(f=>!f.slot||f.slot===slot||(main(f.slot)&&main(slot))).filter(f=>f.kcal>0&&b.kcal/f.kcal>=0.5&&b.kcal/f.kcal<=1.6).slice(0,2).map(f=>{

const PLANSTYLES=[['prep','Meal prep','Tu cuisines 2 fois (dimanche et mercredi) : les repas se répètent'],['simple','Très simple','Mêmes repas toute la semaine, peu d’ingrédients'],['varie','Varié','Un repas différent chaque jour']];
function collectOpts(slot,b,n){
  const out=[],seen={},push=o=>{if(out.length<n&&!seen[o.name]){seen[o.name]=1;out.push(o);}};
  favOpts(slot,b).forEach(push);
  for(let k=0;k<14&&out.length<n;k++)genLocal(slot,b,'').opts.forEach(push);
  return out;
}
function mealFor(o,slot,date){
  const k=T(date,true).kcal*shareOf(slot),f=o.kcal>0?k/o.kcal:1;
  const items=o.items.map(it=>{const r=f,g=it.g>0?Math.max(5,Math.round(it.g*r/5)*5):0,q=it.g>0?g/it.g:r;return Object.assign({},it,{g:g||it.g,kcal:it.kcal*q,p:it.p*q,c:it.c*q,f:it.f*q});});
  const t=sumM(items);return Object.assign({},o,{items,kcal:t.kcal,p:t.p,c:t.c,f:t.f,slot,added:false});
}
function genPlan(style){
  const td=today(),t=baseT(),slots=visibleSlots(td),pool={},isMain=s=>s==='Déjeuner'||s==='Dîner';
  slots.forEach(s=>{const sh=shareOf(s),b={kcal:t.kcal*sh,p:t.p*sh,c:(t.kcal-t.p*4-t.f*9)/4*sh,f:t.f*sh};pool[s]=collectOpts(s,b,style==='varie'?(isMain(s)?7:3):(isMain(s)?2:1));});
  const days=[];
  for(let i=0;i<7;i++){
    const date=addDays(td,i),meals=slots.map(s=>{
      const l=pool[s];if(!l.length)return null;
      const o=style==='varie'?l[i%l.length]:(style==='prep'&&isMain(s)?l[i<4?0:Math.min(1,l.length-1)]:l[0]);
      return mealFor(JSON.parse(JSON.stringify(o)),s,date);
    }).filter(Boolean);
    days.push({date,meals});
  }
  S.plan={style,start:td,days,checked:{},synced:null};planSync();
}
/* chaque jour, les portions des repas à venir suivent la cible du jour (séance, repos, rattrapage d'hier) */
function planSync(){
  const pl=S.plan,td=today();if(!pl||pl.synced===td)return;
  pl.days.forEach(d=>{if(d.date<td)return;d.meals=d.meals.map(m=>m.added?m:mealFor(m,m.slot,d.date));});
  const d0=pl.days.find(d=>d.date===td);
  if(d0){const tt=T(td),k=sumM(d0.meals).kcal;if(k>0){const f=tt.kcal/k;d0.meals=d0.meals.map(m=>m.added?m:Object.assign(mealFor(m,m.slot,td),{}));d0.meals.forEach(m=>{if(m.added)return;const q=f;m.items=m.items.map(it=>{const g=it.g>0?Math.max(5,Math.round(it.g*q/5)*5):0,r=it.g>0?g/it.g:q;return Object.assign({},it,{g:g||it.g,kcal:it.kcal*r,p:it.p*r,c:it.c*r,f:it.f*r});});Object.assign(m,sumM(m.items));});}}
  pl.synced=td;save();
}

const RAW={'Blanc de poulet cuit':['Blanc de poulet (cru)',1.33],'Dinde (blanc) cuit':['Blanc de dinde (cru)',1.33],'Riz cuit':['Riz (cru)',0.4],'Pâtes cuites':['Pâtes (crues)',0.45],'Quinoa cuit':['Quinoa (cru)',0.4],'Lentilles cuites':['Lentilles (sèches)',0.4],'Pois chiches cuits':['Pois chiches (secs)',0.4],'Haricots rouges cuits':['Haricots rouges (secs)',0.4],'Cabillaud cuit':['Cabillaud (cru)',1.2],'Brocoli cuit':['Brocoli (frais)',1.1],'Pomme de terre cuite':['Pommes de terre',1],'Patate douce cuite':['Patates douces',1]};
const SHOPCATS=['Viandes, poissons, œufs et protéines','Féculents et légumineuses','Fruits et légumes','Produits laitiers et boissons','Épicerie et compléments'];
function catOf(n){
  const f=FMAP[n];
  if(f){
    if(/^(Boisson|Lait|Yaourt)/.test(n))return SHOPCATS[3];
    const c=f.cat;
    if(['Viandes & volailles','Poissons & fruits de mer','Œufs','Alternatives végétales'].includes(c))return SHOPCATS[0];
    if(['Féculents & céréales','Pain & viennoiseries','Légumineuses'].includes(c))return SHOPCATS[1];
    if(['Légumes','Fruits'].includes(c))return SHOPCATS[2];
    if(['Produits laitiers','Boissons'].includes(c))return SHOPCATS[3];
    return SHOPCATS[4];
  }
  if(/poulet|dinde|Bœuf|Saumon|Cabillaud|Thon|Crevettes|Œuf|Tofu|Seitan/i.test(n))return SHOPCATS[0];
  if(/Riz|Pâtes|Quinoa|Pain|Flocons|Lentilles|Pois chiches|Haricots|Pomme de terre|Patate/i.test(n))return SHOPCATS[1];
  if(/Brocoli|Banane|^Pomme$|Avocat/i.test(n))return SHOPCATS[2];
  if(/Skyr|Fromage|Yaourt|Lait|Emmental|soja/i.test(n))return SHOPCATS[3];
  return SHOPCATS[4];
}
function rawOf(n){
  if(RAW[n])return RAW[n];
  if(!/(cuit|cuite|cuits|cuites|grillé|grillée|poêlé|poêlée|rôti|rôtie)( |$)/i.test(n))return null;
  const c=catOf(n),base=shortN(n);
  if(/riz|pâtes|semoule|boulgour|couscous|blé|quinoa|nouilles|lentilles|pois|haricots|flageolets/i.test(n)&&!/verts/i.test(n))return [base+' (secs)',0.4];
  if(c===SHOPCATS[0]&&/poulet|dinde|veau|bœuf|porc|agneau|canard|lapin|steak|entrecôte|bavette/i.test(n))return [base+' (cru)',1.3];
  if(c===SHOPCATS[0])return [base+' (cru)',1.2];
  if(c===SHOPCATS[2])return [base+' (frais)',1.1];
  return null;
}
function unitOf(n){const f=FMAP[n];return f&&f.u&&f.u[2]?[f.u[0],f.u[1]+'s']:null;}
const qtyG=g=>g>=1000?nf(Math.ceil(g/100)/10)+' kg':(g<100?Math.ceil(g/10)*10:Math.ceil(g/50)*50)+' g';
function shopList(pl){
  const agg={};
  pl.days.forEach(d=>d.meals.forEach(m=>m.items.forEach(i=>{if(i.g>0)agg[i.name]=(agg[i.name]||0)+i.g;})));
  const rows=Object.keys(agg).map(n=>{
    let g=agg[n],label=shortN(n),qty;const raw=rawOf(n),u=unitOf(n);
    if(raw){label=raw[0];g*=raw[1];}
    if(u){qty=String(Math.max(1,Math.ceil(g/u[0]-0.05)));label=u[1];}else qty=qtyG(g);
    return {key:n,label:capN(label),qty,cat:catOf(n)};
  });
  return SHOPCATS.map(c=>({cat:c,rows:rows.filter(r=>r.cat===c).sort((a,b)=>a.label.localeCompare(b.label,'fr'))})).filter(x=>x.rows.length);
}

function prepSessions(pl){
  const n=pl.days.length;
  return [[0,Math.min(4,n)],[4,n]].filter(g=>g[1]>g[0]).map(g=>{
    const days=pl.days.slice(g[0],g[1]),agg={};let portions=0;
    days.forEach(d=>d.meals.forEach(m=>{if(m.slot==='Déjeuner'||m.slot==='Dîner'){portions++;m.items.forEach(i=>{if(i.g>0)agg[i.name]=(agg[i.name]||0)+i.g;});}}));
    return {from:days[0].date,to:days[days.length-1].date,portions,agg};
  });
}
function prepLines(agg){
  const out={p:[],c:[],v:[],o:[]};
  Object.keys(agg).sort().forEach(n=>{
    const g=agg[n],raw=rawOf(n),cat=catOf(n),line=shortN(n)+' : '+qtyG(g)+(raw?' cuits (≈ '+qtyG(g*raw[1])+' à cuire)':'');
    (cat===SHOPCATS[0]?out.p:cat===SHOPCATS[1]?out.c:cat===SHOPCATS[2]?out.v:out.o).push(line);
  });
  return out;
}
